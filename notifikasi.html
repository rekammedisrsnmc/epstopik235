<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifikasi — EPS-TOPIK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#fafafa;
  --card-bg:#ffffff;
  --text:#1a1a1a;
  --muted:#8a8a8a;
  --border:#e5e5e5;
  --accent:#2563eb;
  --accent-hover:#1d4ed8;
  --sub-bg:#f5f5f5;

  /* warna aksen tipis per tipe notif */
  --c-bantuan:#d97706;
  --c-balasan:#16a34a;
  --c-kuota:#7c3aed;
  --c-sistem:#2563eb;
  --c-request:#dc2626;
}
[data-theme="dark"]{
  --bg:#0f0f0f;
  --card-bg:#1a1a1a;
  --text:#ededed;
  --muted:#888;
  --border:#2a2a2a;
  --accent:#5b9cff;
  --accent-hover:#7ab0ff;
  --sub-bg:#141414;

  --c-bantuan:#fbbf24;
  --c-balasan:#4ade80;
  --c-kuota:#a78bfa;
  --c-sistem:#5b9cff;
  --c-request:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box;
  font-family:-apple-system,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;}
body{
  background:var(--bg);
  min-height:100vh;
  color:var(--text);
  font-size:15px;
  line-height:1.6;
  transition:background .2s,color .2s;
}

/* ===== TOPBAR ===== */
.topbar{
  background:var(--card-bg);
  padding:14px 24px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:10;
  flex-wrap:wrap;
}
.topbar h1{
  font-size:16px;
  color:var(--text);
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
}
.topbar h1 i{color:var(--muted);font-size:14px;}
.topbar .spacer{flex:1;}
.topbar .user{
  font-size:13px;
  color:var(--muted);
}
.topbar .user strong{color:var(--text);font-weight:500;}

/* ===== BUTTONS ===== */
.btn{
  padding:9px 16px;
  border:none;
  border-radius:8px;
  font-weight:500;
  font-size:13px;
  cursor:pointer;
  transition:.15s;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:inherit;
  text-decoration:none;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-secondary{
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover{background:var(--sub-bg);border-color:var(--muted);}
.btn-sm{padding:7px 12px;font-size:12px;}
.btn-xs{padding:5px 10px;font-size:11px;}

.btn-icon{
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  width:36px;height:36px;
  border-radius:50%;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
  transition:.15s;
}
.btn-icon:hover{color:var(--text);border-color:var(--text);}

/* ===== LAYOUT ===== */
.wrap{
  max-width:820px;
  margin:32px auto;
  padding:0 20px;
}
.title{
  font-size:20px;
  font-weight:600;
  color:var(--text);
  margin-bottom:4px;
  letter-spacing:-0.2px;
}
.sub{
  color:var(--muted);
  font-size:13px;
  margin-bottom:24px;
}

/* ===== TOOLBAR ===== */
.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px;
  align-items:center;
}
.filter-tab{
  padding:7px 14px;
  background:transparent;
  color:var(--muted);
  border:1px solid var(--border);
  border-radius:20px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  font-family:inherit;
  transition:.15s;
}
.filter-tab:hover{color:var(--text);border-color:var(--muted);}
.filter-tab.active{
  background:var(--text);
  color:var(--card-bg);
  border-color:var(--text);
}
.toolbar .spacer{flex:1;}

/* ===== NOTIF ITEM ===== */
.notif-item{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px;
  margin-bottom:8px;
  display:flex;
  gap:14px;
  align-items:flex-start;
  border-left:3px solid var(--border);
  transition:.15s;
  position:relative;
  cursor:pointer;
}
.notif-item:hover{border-color:var(--muted);}
.notif-item.unread{background:var(--card-bg);}

.notif-item.tipe-bantuan{border-left-color:var(--c-bantuan);}
.notif-item.tipe-balasan{border-left-color:var(--c-balasan);}
.notif-item.tipe-kuota{border-left-color:var(--c-kuota);}
.notif-item.tipe-sistem{border-left-color:var(--c-sistem);}
.notif-item.tipe-request{border-left-color:var(--c-request);}

.notif-item .icon-box{
  width:36px;height:36px;
  border-radius:8px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  color:var(--muted);
  background:var(--sub-bg);
  border:1px solid var(--border);
}
.notif-item.tipe-bantuan .icon-box{color:var(--c-bantuan);}
.notif-item.tipe-balasan .icon-box{color:var(--c-balasan);}
.notif-item.tipe-kuota .icon-box{color:var(--c-kuota);}
.notif-item.tipe-sistem .icon-box{color:var(--c-sistem);}
.notif-item.tipe-request .icon-box{color:var(--c-request);}

.notif-item .content{flex:1;min-width:0;}
.notif-item .content h3{
  font-size:14px;
  color:var(--text);
  margin-bottom:4px;
  font-weight:600;
}
.notif-item .content p{
  font-size:13px;
  color:var(--muted);
  line-height:1.5;
  margin-bottom:8px;
}
.notif-item .content .meta{
  font-size:11px;
  color:var(--muted);
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}
.notif-item .content .meta span{
  display:flex;
  align-items:center;
  gap:4px;
}
.notif-item .actions{
  display:flex;
  flex-direction:column;
  gap:6px;
  flex-shrink:0;
}
.notif-item .unread-dot{
  position:absolute;
  top:16px;
  right:16px;
  width:8px;height:8px;
  background:var(--accent);
  border-radius:50%;
}

/* btn hapus pakai gaya secondary kecil */
.btn-danger{
  background:transparent;
  color:var(--muted);
  border:1px solid var(--border);
}
.btn-danger:hover{color:#dc2626;border-color:#dc2626;background:transparent;}

/* ===== EMPTY STATE ===== */
.empty{
  text-align:center;
  padding:64px 20px;
  color:var(--muted);
}
.empty i{
  font-size:40px;
  opacity:.4;
  display:block;
  margin-bottom:16px;
}
.empty h3{
  color:var(--text);
  margin-bottom:8px;
  font-size:15px;
  font-weight:600;
}
.empty p{
  font-size:13px;
  margin-bottom:20px;
}

/* ===== LOADING SPINNER ===== */
.loading-box{
  text-align:center;
  padding:80px 20px;
  color:var(--muted);
}
.spinner-lg{
  display:inline-block;
  width:32px;height:32px;
  border:2px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{100%{transform:rotate(360deg)}}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .topbar{padding:12px 16px;}
  .topbar .user{display:none;}
  .notif-item{flex-direction:column;gap:10px;}
  .notif-item .actions{flex-direction:row;width:100%;}
  .notif-item .actions .btn{flex:1;justify-content:center;}
  .wrap{margin:20px auto;}
}
</style>
</head>
<body>

<div class="topbar">
  <h1><i class="fas fa-bell"></i> Notifikasi</h1>
  <div class="spacer"></div>
  <span class="user">👤 <strong id="userName">-</strong></span>
  <button class="btn-icon" onclick="toggleTheme()" title="Ganti tema">
    <i class="fas fa-moon" id="themeIcon"></i>
  </button>
  <a href="dashboard.html" class="btn btn-secondary btn-sm">
    <i class="fas fa-home"></i> Dashboard
  </a>
</div>

<div class="wrap">
  <div class="title">Notifikasi Kamu</div>
  <p class="sub">Semua info & aktivitas akun kamu</p>

  <div class="toolbar">
    <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">Semua</button>
    <button class="filter-tab" data-filter="unread" onclick="setFilter('unread')">Belum Dibaca</button>
    <div class="spacer"></div>
    <button class="btn btn-secondary btn-sm" onclick="markAllRead()">
      <i class="fas fa-check-double"></i> Tandai Semua Dibaca
    </button>
  </div>

  <div id="listBox">
    <div class="loading-box">
      <div class="spinner-lg"></div>
      <p style="margin-top:14px;font-size:13px;">Memuat notifikasi...</p>
    </div>
  </div>
</div>

<script>
// ===== THEME =====
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const icon = document.getElementById('themeIcon');
  if (icon) icon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
}
applyTheme(localStorage.getItem('theme') || 'light');

// ⚠️ GANTI URL INI
const API = 'https://script.google.com/macros/s/AKfycbxCS8Y8fMgZpSmGNBuBwJMERbXuf4CGTQAH2GKXMnIskJKJFUoHg4l3UNrt9YLZ59il/exec';

let user = JSON.parse(localStorage.getItem('user') || 'null');
if (!user) location.href = 'login.html';
document.getElementById('userName').textContent = user.nama || user.username;

let allNotifs = [];
let currentFilter = 'all';

// ===== LOAD =====
function loadNotifs() {
  fetch(API + '?action=getNotifications&username=' + encodeURIComponent(user.username) + '&t=' + Date.now())
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        allNotifs = res.notifications || [];
        renderList();
      } else {
        document.getElementById('listBox').innerHTML = `
          <div class="empty">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Gagal Memuat</h3>
            <p>${res.msg || 'Terjadi kesalahan'}</p>
            <button class="btn btn-primary" onclick="loadNotifs()"><i class="fas fa-redo"></i> Coba Lagi</button>
          </div>`;
      }
    })
    .catch(() => {
      document.getElementById('listBox').innerHTML = `
        <div class="empty">
          <i class="fas fa-exclamation-triangle"></i>
          <h3>Gagal Memuat Notifikasi</h3>
          <p>Periksa koneksi internet Anda</p>
          <button class="btn btn-primary" onclick="loadNotifs()"><i class="fas fa-redo"></i> Coba Lagi</button>
        </div>`;
    });
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === f));
  renderList();
}

// ===== RENDER =====
function renderList() {
  const box = document.getElementById('listBox');
  let filtered = allNotifs;
  if (currentFilter === 'unread') filtered = allNotifs.filter(n => !n.isRead);

  if (filtered.length === 0) {
    box.innerHTML = `
      <div class="empty">
        <i class="fas fa-bell-slash"></i>
        <h3>${currentFilter === 'unread' ? 'Nggak ada yang belum dibaca' : 'Belum ada notifikasi'}</h3>
        <p>${currentFilter === 'unread' ? 'Semua notif udah dibaca 👍' : 'Notifikasi bakal muncul di sini kalau ada aktivitas'}</p>
      </div>`;
    return;
  }

  const icons = {
    'bantuan': 'fa-question-circle',
    'balasan': 'fa-comment-dots',
    'kuota': 'fa-ticket-alt',
    'sistem': 'fa-info-circle',
    'request': 'fa-paper-plane',
    'info': 'fa-bell'
  };

  let html = '';
  filtered.forEach(n => {
    const iconClass = icons[n.tipe] || 'fa-bell';
    html += `
      <div class="notif-item tipe-${n.tipe} ${!n.isRead ? 'unread' : ''}"
           onclick="onNotifClick(${n.id}, ${n.isRead}, '${(n.linkUrl || '').replace(/'/g, "\\'")}')">
        ${!n.isRead ? '<div class="unread-dot"></div>' : ''}
        <div class="icon-box"><i class="fas ${iconClass}"></i></div>
        <div class="content">
          <h3>${n.judul}</h3>
          <p>${n.pesan}</p>
          <div class="meta">
            <span><i class="fas fa-clock"></i> ${n.tanggal}</span>
            <span><i class="fas fa-user"></i> ${n.from === 'system' ? 'Sistem' : '@' + n.from}</span>
          </div>
        </div>
        <div class="actions">
          ${!n.isRead ? `<button class="btn btn-primary btn-xs" onclick="event.stopPropagation();markRead(${n.id})"><i class="fas fa-check"></i> Baca</button>` : ''}
          <button class="btn btn-danger btn-xs" onclick="event.stopPropagation();deleteNotif(${n.id})" title="Hapus"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
  });
  box.innerHTML = html;
}

// ===== ACTIONS =====
function onNotifClick(notifId, isRead, linkUrl) {
  if (!isRead) markRead(notifId, true);
  if (linkUrl) {
    setTimeout(() => location.href = linkUrl, 200);
  }
}

async function markRead(notifId, silent) {
  try {
    await fetch(API, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action: 'markNotifRead', username: user.username, notifId })
    });
    const idx = allNotifs.findIndex(n => n.id === notifId);
    if (idx >= 0) allNotifs[idx].isRead = true;
    if (!silent) renderList();
    if (window.parent && window.parent.updateNotifBadge) window.parent.updateNotifBadge();
  } catch(e) {}
}

async function markAllRead() {
  if (allNotifs.filter(n => !n.isRead).length === 0) {
    alert('Semua notif udah dibaca 👍');
    return;
  }
  try {
    await fetch(API, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action: 'markAllNotifRead', username: user.username })
    });
    allNotifs.forEach(n => n.isRead = true);
    renderList();
    if (window.parent && window.parent.updateNotifBadge) window.parent.updateNotifBadge();
  } catch(e) { alert('Gagal: ' + e.message); }
}

async function deleteNotif(notifId) {
  if (!confirm('Hapus notifikasi ini?')) return;
  try {
    await fetch(API, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action: 'deleteNotif', username: user.username, notifId })
    });
    allNotifs = allNotifs.filter(n => n.id !== notifId);
    renderList();
    if (window.parent && window.parent.updateNotifBadge) window.parent.updateNotifBadge();
  } catch(e) { alert('Gagal: ' + e.message); }
}

// INIT
loadNotifs();
</script>
</body>
</html>
