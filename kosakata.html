<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kosakata 한국어 | Latihan Bahasa Korea</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --blue:#1e5fa8; --blue-dark:#154a82; --blue-light:#e8f0fa;
  --bg:#f5f7fa; --border:#d0d7e2; --text:#1a1a1a;
  --shadow:0 4px 16px rgba(0,0,0,.08);
  --red:#d9534f; --green:#2fa36b; --yellow:#f0ad4e;
  --card-bg:#fff; --muted:#888; --sub-bg:#f5f7fa;
  --purple:#7c4dff; --teal:#26a69a;
}
[data-theme="dark"]{
  --blue:#5b9cff; --blue-dark:#3a7bd5; --blue-light:#1e3556;
  --bg:#0a111f; --border:#2a3448; --text:#e8eef7;
  --shadow:0 4px 16px rgba(0,0,0,.4);
  --card-bg:#151d2e; --muted:#8b9bb4; --sub-bg:#0f1626;
  --purple:#b39ddb; --teal:#4db6ac;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Malgun Gothic',-apple-system,sans-serif;}
body{background:var(--bg);min-height:100vh;color:var(--text);transition:background .3s,color .3s;}
.exam-paper{max-width:760px;margin:30px auto;background:var(--card-bg);box-shadow:var(--shadow);border-radius:16px;padding:40px 50px;position:relative;transition:background .3s;overflow:hidden;}
.exam-paper::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#2fa36b,#26a69a,#1e5fa8);}
.exam-icon{text-align:center;font-size:44px;margin-bottom:8px;}
.exam-title{text-align:center;font-size:14px;color:var(--muted);margin-bottom:6px;letter-spacing:2px;text-transform:uppercase;font-weight:600;}
.exam-heading{text-align:center;font-size:24px;font-weight:800;margin:8px 0 6px 0;color:var(--blue);letter-spacing:1px;}
.exam-subtitle{text-align:center;font-size:13px;color:var(--muted);margin-bottom:28px;}
.tema-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:800;background:linear-gradient(135deg,#2fa36b,#26a69a);color:#fff;letter-spacing:1.5px;margin:0 auto 16px;text-align:center;display:table;}
.question{margin-bottom:32px;}
.question-num{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px;display:inline-block;background:var(--blue-light);padding:4px 12px;border-radius:20px;letter-spacing:1px;}
.question-body{display:flex;gap:24px;align-items:flex-start;}
.question-media{flex-shrink:0;width:200px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.question-media img{max-width:100%;max-height:180px;border-radius:10px;object-fit:contain;box-shadow:0 4px 12px rgba(0,0,0,.08);}
.question-text{font-size:17px;line-height:1.7;color:var(--text);margin-bottom:12px;font-weight:500;}
.question-content{flex:1;min-width:0;}
.question-media audio{width:100%;margin-top:8px;}
.options{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.options.vertical{grid-template-columns:1fr;}
.options li{font-size:15px;line-height:1.5;color:var(--text);padding:12px 16px;border-radius:10px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px;border:2px solid var(--border);user-select:none;background:var(--card-bg);}
.options li:hover{background:var(--blue-light);border-color:var(--blue);transform:translateY(-1px);}
.options li.selected{background:var(--blue-light);border-color:var(--blue);font-weight:700;}
.options li.selected .circle{color:var(--blue);}
.options li .circle{font-size:16px;color:var(--muted);flex-shrink:0;font-weight:700;}
.fill-input{width:100%;padding:14px 18px;border:2px solid var(--border);border-radius:10px;font-size:16px;margin-top:10px;font-family:inherit;background:var(--card-bg);color:var(--text);transition:.2s;}
.fill-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(30,95,168,.15);}
.nav-bar{max-width:760px;margin:0 auto 30px;padding:0 50px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;}
.btn{padding:12px 24px;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px;font-family:inherit;text-decoration:none;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-1px);}
.btn-secondary{background:var(--sub-bg);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover:not(:disabled){background:var(--border);}
.btn-success{background:var(--green);color:#fff;}
.btn-success:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn-warning{background:var(--yellow);color:#fff;}
.exam-info{max-width:760px;margin:20px auto 0;padding:14px 22px;background:var(--card-bg);border-radius:12px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.exam-info .item{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.exam-info .item strong{color:var(--blue);font-size:15px;}
.exam-info .btn-icon{background:transparent;border:1.5px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.2s;}
.exam-info .btn-icon:hover{background:var(--sub-bg);border-color:var(--blue);color:var(--blue);}
.timer{background:linear-gradient(135deg,#2fa36b,#26a69a);color:#fff;padding:8px 18px;border-radius:30px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
.timer.warning{background:var(--yellow);}
.timer.danger{background:var(--red);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.75}}
.progress-wrap{max-width:760px;margin:12px auto 0;height:8px;background:var(--sub-bg);border-radius:8px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#2fa36b,#26a69a,#1e5fa8);width:0%;transition:width .3s;border-radius:8px;}
.spinner-container{text-align:center;padding:100px 20px;}
.spinner{display:inline-block;width:44px;height:44px;border:4px solid var(--sub-bg);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{100%{transform:rotate(360deg)}}
.spinner-container p{margin-top:14px;color:var(--muted);}
.result-wrap{max-width:760px;margin:30px auto;padding:40px;background:var(--card-bg);border-radius:16px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;}
.result-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#2fa36b,#26a69a,#1e5fa8);}
.result-wrap h1{color:var(--blue);margin-bottom:8px;}
.result-wrap .sub{color:var(--muted);margin-bottom:24px;}
.score-big{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#2fa36b,#1f7f53);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 12px 40px rgba(47,163,107,.4);border:6px solid rgba(255,255,255,.2);}
.score-big .num{font-size:56px;font-weight:800;line-height:1;}
.score-big .lbl{font-size:12px;opacity:0.9;margin-top:6px;letter-spacing:2px;font-weight:700;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0;}
.stat{padding:18px;background:var(--sub-bg);border-radius:12px;transition:.2s;}
.stat:hover{transform:translateY(-2px);}
.stat .n{font-size:28px;font-weight:800;}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;}
.stat.green .n{color:var(--green);}
.stat.red .n{color:var(--red);}
.stat.gray .n{color:var(--muted);}
.review-item{text-align:left;background:var(--card-bg);border:1.5px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;transition:.2s;}
.review-item:hover{border-color:var(--blue);}
.review-item.correct{border-left:5px solid var(--green);}
.review-item.wrong{border-left:5px solid var(--red);}
.review-item .rhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px;}
.review-item .rhead .ok{color:var(--green);}
.review-item .rhead .no{color:var(--red);}
.review-item .rq{font-size:14px;margin-bottom:10px;color:var(--text);}
.review-item .ra{font-size:13px;color:var(--muted);background:var(--sub-bg);padding:10px 14px;border-radius:8px;line-height:1.6;}
.cert-hint{margin-top:20px;padding:14px 18px;background:linear-gradient(135deg,#fff8e1,#fffbf0);border:2px dashed #f0ad4e;border-radius:12px;font-size:13px;color:#8a6a1a;display:flex;align-items:center;gap:10px;}
.cert-hint i{font-size:22px;color:#f0ad4e;}
.saved-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#2fa36b;background:#e8f5ee;padding:6px 14px;border-radius:20px;margin-top:8px;font-weight:600;}
footer{text-align:center;padding:24px 20px;color:var(--muted);font-size:13px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1}}
.fade{animation:fadeUp .4s ease;}
.blocked-wrap{max-width:600px;margin:60px auto;padding:40px;background:var(--card-bg);border-radius:16px;box-shadow:var(--shadow);text-align:center;}
.blocked-wrap .icon-big{font-size:64px;margin-bottom:16px;}
.blocked-wrap h1{color:var(--red);margin-bottom:12px;font-size:22px;}
.blocked-wrap p{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:24px;}
@media(max-width:700px){
  .exam-paper{padding:28px 20px;margin:15px;border-radius:12px;}
  .nav-bar{padding:0 20px;}
  .question-body{flex-direction:column;}
  .question-media{width:100%;}
  .options{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:1fr;}
  .score-big{width:150px;height:150px;}
  .score-big .num{font-size:46px;}
  .exam-heading{font-size:20px;}
}
</style>
</head>
<body>

<div class="exam-info" id="examInfo" style="display:none;">
  <div class="item">📝 Soal <strong id="curNum">1</strong> / <strong id="totNum">-</strong></div>
  <div class="item">✅ Terjawab: <strong id="answeredNum">0</strong></div>
  <button class="btn-icon" onclick="toggleTheme()" title="Toggle dark mode"><i class="fas fa-moon" id="themeIcon"></i></button>
  <div class="timer" id="timerBox"><i class="fas fa-clock"></i> <span id="timerText">--:--</span></div>
</div>
<div class="progress-wrap" id="progressWrap" style="display:none;">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div id="app">
  <div class="spinner-container">
    <div class="spinner"></div>
    <p>Memeriksa kuota...</p>
  </div>
</div>

<footer>한국어 어휘 (Kosakata Bahasa Korea) — EPS-TOPIK Practice</footer>

<script>
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const icon = document.getElementById('themeIcon');
  if (icon) icon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
}
applyTheme(localStorage.getItem('theme') || 'light');

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwGsUnn93GQGnCGYITxYas-ig5BGa0O1191cxp_wNjeESRYsCJZgsYXClQNKGSyDAjQ/exec';

const _user = JSON.parse(localStorage.getItem('user') || 'null');
if (!_user) location.href = 'login.html';

// ===== DAFTAR TEMA =====
const TEMA_MAP = {
  'transportasi':   { label: 'Transportasi',     icon: 'fa-bus',            icoClass: 'ico-transportasi' },
  'makanan':        { label: 'Makanan & Minuman', icon: 'fa-utensils',      icoClass: 'ico-makanan' },
  'tempat_wisata':  { label: 'Tempat Wisata',    icon: 'fa-landmark',      icoClass: 'ico-wisata' },
  'keluarga':       { label: 'Keluarga',         icon: 'fa-users',         icoClass: 'ico-keluarga' },
  'sekolah':        { label: 'Sekolah',          icon: 'fa-graduation-cap', icoClass: 'ico-sekolah' },
  'tubuh':          { label: 'Anggota Tubuh',    icon: 'fa-hand-paper',    icoClass: 'ico-tubuh' },
  'pakaian':        { label: 'Pakaian',          icon: 'fa-tshirt',        icoClass: 'ico-pakaian' },
  'alam':           { label: 'Alam & Cuaca',     icon: 'fa-cloud-sun',     icoClass: 'ico-alam' },
  'pekerjaan':      { label: 'Pekerjaan',        icon: 'fa-briefcase',     icoClass: 'ico-pekerjaan' },
  'hobi':           { label: 'Hobi & Olahraga',  icon: 'fa-futbol',        icoClass: 'ico-hobi' },
  'umum':           { label: 'Kosakata Umum',    icon: 'fa-book',          icoClass: 'ico-umum' }
};

// ===== BACA TEMA DARI URL =====
const params = new URLSearchParams(location.search);
const tema = params.get('tema') || 'umum';
const temaInfo = TEMA_MAP[tema] || { label: 'Kosakata', icon: 'fa-book' };
const isSemuaTema = (tema === 'semua');

// Kategori yang dikirim ke API
// Kalau "semua" → query semua yang berawalan kosakata_
// Kalau tema spesifik → kosakata_<tema>
const kategoriQuery = isSemuaTema ? 'kosakata' : 'kosakata_' + tema;

let questions = [];
let currentIndex = 0;
let answers = {};
let startTime = null;
let timerInterval = null;
let examDuration = 20 * 60;
let isFinished = false;
let resultSaved = false;

const CIRCLES = { '1':'①', '2':'②', '3':'③', '4':'④' };

async function checkQuota() {
  if (_user.role === 'admin') return true;
  try {
    const r = await fetch(APPS_SCRIPT_URL + '?action=getQuota&username=' + encodeURIComponent(_user.username) + '&t=' + Date.now());
    const res = await r.json();
    if (res.success) {
      _user.quotaUsed = res.quotaUsed;
      _user.quotaMax = res.quotaMax;
      localStorage.setItem('user', JSON.stringify(_user));
      return res.canExam;
    }
  } catch(e) {}
  return true;
}

function showBlockedScreen() {
  document.getElementById('examInfo').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="blocked-wrap fade">
      <div class="icon-big">🔒</div>
      <h1>Kuota Ujian Habis</h1>
      <p>Kamu sudah menggunakan semua kuota ujian.<br>Silakan request tambah kuota ke admin melalui dashboard.</p>
      <a href="dashboard.html" class="btn btn-primary"><i class="fas fa-home"></i> Ke Dashboard</a>
    </div>`;
}

async function loadQuestions() {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="spinner-container"><div class="spinner"></div><p>Memeriksa kuota...</p></div>`;

  const canExam = await checkQuota();
  if (!canExam) { showBlockedScreen(); return; }

  app.innerHTML = `<div class="spinner-container"><div class="spinner"></div><p>Memuat soal kosakata...</p></div>`;

  // Kalau "semua", panggil getData tanpa filter, terus filter client-side
  const url = isSemuaTema
    ? APPS_SCRIPT_URL + '?action=getData&kategori=all&t=' + Date.now()
    : APPS_SCRIPT_URL + '?action=getData&kategori=' + encodeURIComponent(kategoriQuery) + '&t=' + Date.now();

  fetch(url)
    .then(res => { if (!res.ok) throw new Error('Network error'); return res.json(); })
    .then(data => {
      let filtered = Array.isArray(data) ? data : [];

      // Kalau "semua tema", filter cuma yang berawalan "kosakata"
      if (isSemuaTema) {
        filtered = filtered.filter(q => String(q.kategori || '').toLowerCase().startsWith('kosakata'));
      }

      if (filtered.length > 0) {
        questions = filtered;
        startExam();
      } else {
        app.innerHTML = `
          <div class="result-wrap">
            <div class="exam-icon">📭</div>
            <h1>Belum Ada Soal</h1>
            <p class="sub">Tema <strong>${isSemuaTema ? 'Semua Tema' : temaInfo.label}</strong> belum punya soal.<br>Silakan hubungi admin.</p>
            <a href="dashboard.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Kembali ke Dashboard</a>
          </div>`;
      }
    })
    .catch(() => {
      app.innerHTML = `
        <div class="result-wrap">
          <div class="exam-icon">⚠️</div>
          <h1>Gagal Memuat Soal</h1>
          <p class="sub">Periksa koneksi internet Anda</p>
          <button class="btn btn-primary" onclick="loadQuestions()"><i class="fas fa-redo"></i> Coba Lagi</button>
        </div>`;
    });
}

function startExam() {
  currentIndex = 0;
  answers = {};
  isFinished = false;
  resultSaved = false;
  startTime = Date.now();
  examDuration = Math.max(questions.length * 90, 300);

  document.getElementById('examInfo').style.display = 'flex';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('totNum').textContent = questions.length;

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  renderQuestion();
}

function updateTimer() {
  if (isFinished) return;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const remaining = examDuration - elapsed;
  const box = document.getElementById('timerBox');
  const text = document.getElementById('timerText');
  if (remaining <= 0) { clearInterval(timerInterval); finishExam(true); return; }
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  text.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  box.classList.remove('warning','danger');
  if (remaining <= 60) box.classList.add('danger');
  else if (remaining <= 300) box.classList.add('warning');
}

function renderQuestion() {
  const app = document.getElementById('app');
  const q = questions[currentIndex];
  const total = questions.length;

  document.getElementById('curNum').textContent = currentIndex + 1;
  const answeredCount = Object.keys(answers).filter(k => answers[k] !== '' && answers[k] !== undefined).length;
  document.getElementById('answeredNum').textContent = answeredCount;
  document.getElementById('progressFill').style.width = ((currentIndex + 1) / total) * 100 + '%';

  let mediaHtml = '';
  if (q.gambar) mediaHtml += `<img src="${q.gambar}" alt="gambar soal" onerror="this.style.display='none'">`;
  if (q.audio) mediaHtml += `<audio controls preload="metadata" style="width:100%;"><source src="${q.audio}"></audio>`;

  let optionsHtml = '';
  if (q.section === 'isian') {
    const val = (answers[currentIndex] || '').replace(/"/g, '&quot;');
    optionsHtml = `<input type="text" class="fill-input" id="fillInput" placeholder="답을 입력하세요..." value="${val}" oninput="saveAnswer(this.value)">`;
  } else {
    const opts = [
      { n:'1', t:q.opsiA }, { n:'2', t:q.opsiB }, { n:'3', t:q.opsiC }, { n:'4', t:q.opsiD }
    ].filter(o => o.t);
    const cls = (q.section === 'pilihan_gambar') ? '' : 'vertical';
    optionsHtml = `<ul class="options ${cls}">`;
    opts.forEach(o => {
      const sel = String(answers[currentIndex]) === o.n ? 'selected' : '';
      optionsHtml += `<li class="${sel}" onclick="selectAnswer('${o.n}')"><span class="circle">${CIRCLES[o.n]}</span><span>${o.t}</span></li>`;
    });
    optionsHtml += '</ul>';
  }

  const badgeHtml = isSemuaTema
    ? `<div class="tema-badge">📚 SEMUA TEMA</div>`
    : `<div class="tema-badge">📚 ${temaInfo.label.toUpperCase()}</div>`;

  const hasMedia = mediaHtml !== '';
  const bodyHtml = hasMedia
    ? `<div class="question-body"><div class="question-media">${mediaHtml}</div><div class="question-content">${q.soal ? `<div class="question-text">${q.soal}</div>` : ''}${optionsHtml}</div></div>`
    : `<div class="question-body"><div class="question-content">${q.soal ? `<div class="question-text">${q.soal}</div>` : ''}${optionsHtml}</div></div>`;

  const isFirst = currentIndex === 0;
  const isLast = currentIndex === total - 1;

  app.innerHTML = `
    <div class="exam-paper fade" id="paper">
      <div class="exam-icon">📚</div>
      <div class="exam-title">Korean Vocabulary Practice</div>
      <div class="exam-heading">Kosakata 한국어</div>
      <div class="exam-subtitle">Latihan perbendaharaan kata bahasa Korea</div>
      ${badgeHtml}
      <div class="question">
        <div class="question-num">Soal ${currentIndex + 1} dari ${total}</div>
        ${bodyHtml}
      </div>
    </div>
    <div class="nav-bar">
      <button class="btn btn-secondary" onclick="prevQuestion()" ${isFirst ? 'disabled' : ''}><i class="fas fa-arrow-left"></i> Sebelumnya</button>
      ${isLast
        ? `<button class="btn btn-success" onclick="finishExam(false)"><i class="fas fa-check"></i> Selesai & Lihat Hasil</button>`
        : `<button class="btn btn-primary" onclick="nextQuestion()">Selanjutnya <i class="fas fa-arrow-right"></i></button>`}
    </div>`;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function selectAnswer(num) {
  answers[currentIndex] = num;
  document.querySelectorAll('.options li').forEach(li => {
    const circle = li.querySelector('.circle').textContent;
    li.classList.toggle('selected', circle === CIRCLES[num]);
  });
  updateAnsweredCount();
}
function saveAnswer(val) { answers[currentIndex] = val; updateAnsweredCount(); }
function updateAnsweredCount() {
  const n = Object.keys(answers).filter(k => answers[k] !== '' && answers[k] !== undefined).length;
  document.getElementById('answeredNum').textContent = n;
}
function nextQuestion() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

function finishExam(timeUp) {
  if (isFinished) return;
  if (!timeUp && !confirm('Yakin ingin menyelesaikan latihan dan lihat hasil?')) return;

  isFinished = true;
  clearInterval(timerInterval);

  let correct = 0, wrong = 0, blank = 0;

  questions.forEach((q, i) => {
    const ua = (answers[i] || '').toString().trim();
    const ca = (q.jawaban || '').toString().trim();
    if (!ua) { blank++; return; }
    let isCorrect = false;
    if (q.section === 'isian') isCorrect = ua.toLowerCase() === ca.toLowerCase();
    else isCorrect = ua === ca;
    if (isCorrect) correct++;
    else wrong++;
  });

  const total = questions.length;
  const score = Math.round((correct / total) * 100);

  document.getElementById('examInfo').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';

  let grade = 'A', color = 'linear-gradient(135deg,#2fa36b,#1f7f53)', gradeText = 'Luar Biasa!';
  if (score < 90) { grade = 'B'; gradeText = 'Bagus!'; }
  if (score < 80) { grade = 'C'; color = 'linear-gradient(135deg,#f0ad4e,#ec971f)'; gradeText = 'Cukup Baik'; }
  if (score < 70) { grade = 'D'; color = 'linear-gradient(135deg,#f0ad4e,#ec971f)'; gradeText = 'Perlu Belajar Lagi'; }
  if (score < 60) { grade = 'E'; color = 'linear-gradient(135deg,#d9534f,#c9302c)'; gradeText = 'Ayo Semangat!'; }

  const canCert = score >= 70;

  document.getElementById('app').innerHTML = `
    <div class="result-wrap fade">
      <div class="exam-icon">🎉</div>
      <h1>Latihan Selesai!</h1>
      <p class="sub">${timeUp ? '⏰ Waktu habis' : 'Hasil latihan kosakata kamu'} — ${gradeText}</p>
      <div class="score-big" style="background:${color}"><div class="num">${score}</div><div class="lbl">SKOR AKHIR</div></div>
      <p style="font-size:20px;font-weight:800;color:var(--blue);margin-bottom:20px;">Grade ${grade}</p>
      <div class="stat-grid">
        <div class="stat green"><div class="n">${correct}</div><div class="l">정답 (Benar)</div></div>
        <div class="stat red"><div class="n">${wrong}</div><div class="l">오답 (Salah)</div></div>
        <div class="stat gray"><div class="n">${blank}</div><div class="l">미응답 (Kosong)</div></div>
      </div>
      <div id="saveStatus" style="text-align:center;"></div>
      ${canCert ? `<div class="cert-hint"><i class="fas fa-award"></i><div style="text-align:left;"><strong>Selamat! 🎉</strong><br>Skor kamu ≥ 70. Bisa cetak sertifikat di halaman Riwayat.</div></div>` : ''}
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;">
        <a href="dashboard.html" class="btn btn-secondary"><i class="fas fa-home"></i> Dashboard</a>
        <a href="riwayat.html" class="btn btn-warning"><i class="fas fa-history"></i> Riwayat</a>
        <button class="btn btn-primary" onclick="location.reload()"><i class="fas fa-redo"></i> Ulangi</button>
        <button class="btn btn-success" onclick="showReview()"><i class="fas fa-list"></i> Review Jawaban</button>
      </div>
      <div id="reviewBox" style="display:none;margin-top:28px;"></div>
    </div>`;
  window.scrollTo({top: 0, behavior: 'smooth'});

  saveResultToServer(score, correct, wrong, blank, total);
}

function saveResultToServer(skor, benar, salah, kosong, total) {
  if (resultSaved) return;
  resultSaved = true;
  const statusBox = document.getElementById('saveStatus');
  if (statusBox) statusBox.innerHTML = '<span class="saved-badge"><i class="fas fa-spinner fa-spin"></i> Menyimpan hasil...</span>';

  // Simpan kategori dengan format: kosakata_<tema> (atau "kosakata" kalau semua tema)
  const saveKategori = isSemuaTema ? 'kosakata' : 'kosakata_' + tema;

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'saveResult',
      username: _user.username,
      kategori: saveKategori,
      skor, benar, salah, kosong, total,
      benarListening: 0, totalListening: 0,
      benarReading: benar, totalReading: total
    })
  })
  .then(r => r.text())
  .then(text => {
    let res; try { res = JSON.parse(text); } catch(e) { res = { success: false }; }
    if (statusBox) {
      if (res.success) {
        _user.quotaUsed = res.quotaUsed;
        _user.quotaMax = res.quotaMax;
        localStorage.setItem('user', JSON.stringify(_user));
        const remain = res.remaining;
        const remainText = remain > 0 ? ` · Sisa kuota: ${remain}` : ' · ⚠️ Kuota habis';
        statusBox.innerHTML = `<span class="saved-badge"><i class="fas fa-check"></i> Hasil tersimpan${remainText}</span>`;
      } else {
        statusBox.innerHTML = '<span class="saved-badge" style="background:#fde8e8;color:#a33;"><i class="fas fa-times"></i> ' + (res.msg || 'Gagal simpan hasil') + '</span>';
      }
    }
  })
  .catch(() => {
    if (statusBox) statusBox.innerHTML = '<span class="saved-badge" style="background:#fde8e8;color:#a33;"><i class="fas fa-times"></i> Gagal simpan hasil</span>';
  });
}

function showReview() {
  const box = document.getElementById('reviewBox');
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  let html = '';
  questions.forEach((q, i) => {
    const ua = (answers[i] || '').toString().trim();
    const ca = (q.jawaban || '').toString().trim();
    let ok = false;
    if (q.section === 'isian') ok = ua.toLowerCase() === ca.toLowerCase();
    else ok = ua === ca;
    const dispUA = (q.section === 'isian') ? (ua || '(kosong)') : (CIRCLES[ua] || ua || '(kosong)');
    const dispCA = (q.section === 'isian') ? ca : (CIRCLES[ca] || ca);
    html += `
      <div class="review-item ${ok ? 'correct' : 'wrong'}">
        <div class="rhead"><span>Soal ${i + 1}</span><span class="${ok ? 'ok' : 'no'}">${ok ? '✓ Benar' : '✗ Salah'}</span></div>
        <div class="rq">${q.soal || '(gambar/audio)'}</div>
        <div class="ra">Jawaban Anda: <strong>${dispUA}</strong><br>Jawaban Benar: <strong style="color:var(--green);">${dispCA}</strong>${q.pembahasan ? `<br><br><strong>Pembahasan:</strong> ${q.pembahasan}` : ''}</div>
      </div>`;
  });
  box.innerHTML = html;
  box.style.display = 'block';
}

loadQuestions();
</script>
