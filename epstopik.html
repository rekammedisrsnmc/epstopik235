<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EPS-TOPIK 쓰기 | Ujian Bahasa Korea</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --blue:#1e5fa8; --blue-dark:#154a82; --blue-light:#e8f0fa;
  --bg:#f5f7fa; --border:#d0d7e2; --text:#1a1a1a;
  --shadow:0 4px 16px rgba(0,0,0,.08);
  --red:#d9534f; --green:#2fa36b; --yellow:#f0ad4e;
  --card-bg:#fff; --muted:#888; --sub-bg:#f5f7fa;
}
[data-theme="dark"]{
  --blue:#5b9cff; --blue-dark:#3a7bd5; --blue-light:#1e3556;
  --bg:#0a111f; --border:#2a3448; --text:#e8eef7;
  --shadow:0 4px 16px rgba(0,0,0,.4);
  --card-bg:#151d2e; --muted:#8b9bb4; --sub-bg:#0f1626;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Malgun Gothic',-apple-system,sans-serif;}
body{background:var(--bg);min-height:100vh;color:var(--text);transition:background .3s,color .3s;}
.exam-paper{max-width:800px;margin:30px auto;background:var(--card-bg);box-shadow:var(--shadow);border-radius:4px;padding:50px 60px;transition:background .3s;}
.exam-title{text-align:center;font-size:15px;color:var(--muted);margin-bottom:30px;}
.question{margin-bottom:32px;}

/* ⚡ NOMOR SOAL — sekarang di dalam body */
.question-num{
  font-size:15px;
  font-weight:700;
  color:var(--text);
  flex-shrink:0;
  min-width:32px;
  padding-top:2px;
}
.question-num::after{content:'.';}

/* ⚡ INSTRUKSI — kotak petunjuk di atas soal */
.question-instruction{
  font-size:13px;
  color:var(--muted);
  font-style:italic;
  padding:10px 14px;
  background:var(--sub-bg);
  border-left:3px solid var(--blue);
  border-radius:6px;
  margin-bottom:12px;
  line-height:1.6;
  display:flex;
  align-items:flex-start;
  gap:8px;
}
.question-instruction::before{
  content:'📌';
  flex-shrink:0;
  font-style:normal;
}

/* ⚡ BODY — nomor + media + content */
.question-body{
  display:flex;
  gap:16px;
  align-items:flex-start;
  padding-left:0;
}

.question-media{
  flex-shrink:0;
  width:200px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.question-media img{
  max-width:100%;
  max-height:180px;
  border-radius:4px;
  object-fit:contain;
  border:1px solid var(--border);
  padding:4px;
  background:#fff;
}

.question-text{font-size:15px;line-height:1.8;color:var(--text);margin-bottom:10px;}
.question-content{flex:1;min-width:0;}
.question-media audio{width:100%;margin-top:8px;}

.options{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin-top:12px;}
.options.vertical{grid-template-columns:1fr;}
.options li{font-size:15px;line-height:1.6;color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;transition:0.15s;display:flex;align-items:center;gap:8px;border:2px solid transparent;user-select:none;}
.options li:hover{background:var(--blue-light);}
.options li.selected{background:var(--blue-light);border-color:var(--blue);font-weight:600;}
.options li .circle{font-size:15px;color:var(--text);flex-shrink:0;}
.options li.selected .circle{color:var(--blue);}
.options li img{max-height: 80px;border-radius: 6px;object-fit: contain;}
.options li:has(img){padding: 10px;align-items: center;}
.fill-input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:6px;font-size:15px;margin-top:10px;font-family:inherit;background:var(--card-bg);color:var(--text);}
.fill-input:focus{outline:none;border-color:var(--blue);}
.nav-bar{max-width:800px;margin:0 auto 30px;padding:0 60px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;}
.btn{padding:11px 24px;border:none;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;transition:0.2s;display:inline-flex;align-items:center;gap:8px;font-family:inherit;text-decoration:none;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover:not(:disabled){filter:brightness(1.15);}
.btn-secondary{background:var(--sub-bg);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover:not(:disabled){background:var(--border);}
.btn-success{background:var(--green);color:#fff;}
.btn-success:hover{filter:brightness(1.1);}
.btn-warning{background:var(--yellow);color:#fff;}
.exam-info{max-width:800px;margin:20px auto 0;padding:16px 24px;background:var(--card-bg);border-radius:8px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.exam-info .item{font-size:14px;color:var(--muted);}
.exam-info .item strong{color:var(--blue);font-size:16px;}
.exam-info .btn-icon{background:transparent;border:1.5px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.2s;}
.exam-info .btn-icon:hover{background:var(--sub-bg);border-color:var(--blue);color:var(--blue);}
.timer{background:var(--blue);color:#fff;padding:8px 18px;border-radius:30px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;}
.timer.warning{background:var(--yellow);}
.timer.danger{background:var(--red);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.75}}
.progress-wrap{max-width:800px;margin:12px auto 0;height:6px;background:var(--sub-bg);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:var(--blue);width:0%;transition:width 0.3s;}
.spinner-container{text-align:center;padding:100px 20px;}
.spinner{display:inline-block;width:44px;height:44px;border:4px solid var(--sub-bg);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{100%{transform:rotate(360deg)}}
.spinner-container p{margin-top:14px;color:var(--muted);}
.result-wrap{max-width:800px;margin:30px auto;padding:40px;background:var(--card-bg);border-radius:12px;box-shadow:var(--shadow);text-align:center;}
.result-wrap h1{color:var(--blue);margin-bottom:8px;}
.result-wrap .sub{color:var(--muted);margin-bottom:24px;}
.score-big{width:160px;height:160px;border-radius:50%;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 8px 30px rgba(30,95,168,0.35);}
.score-big .num{font-size:52px;font-weight:800;line-height:1;}
.score-big .lbl{font-size:13px;opacity:0.9;margin-top:4px;letter-spacing:2px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0;}
.stat{padding:18px;background:var(--sub-bg);border-radius:10px;}
.stat .n{font-size:26px;font-weight:800;}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px;}
.stat.green .n{color:var(--green);}
.stat.red .n{color:var(--red);}
.stat.gray .n{color:var(--muted);}
.review-item{text-align:left;background:var(--card-bg);border:1.5px solid var(--border);border-radius:10px;padding:18px;margin-bottom:12px;}
.review-item.correct{border-left:5px solid var(--green);}
.review-item.wrong{border-left:5px solid var(--red);}
.review-item .rhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px;}
.review-item .rhead .ok{color:var(--green);}
.review-item .rhead .no{color:var(--red);}
.review-item .rq{font-size:14px;margin-bottom:10px;color:var(--text);}
.review-item .ra{font-size:13px;color:var(--muted);background:var(--sub-bg);padding:8px 12px;border-radius:6px;}
.review-item .rinstruksi{font-size:12px;color:var(--muted);font-style:italic;padding:8px 12px;background:var(--sub-bg);border-left:3px solid var(--blue);border-radius:4px;margin-bottom:8px;}
.cert-hint{margin-top:20px;padding:14px 18px;background:linear-gradient(135deg,#fff8e1,#fffbf0);border:2px dashed #f0ad4e;border-radius:10px;font-size:13px;color:#8a6a1a;display:flex;align-items:center;gap:10px;}
.cert-hint i{font-size:20px;color:#f0ad4e;}
.saved-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#2fa36b;background:#e8f5ee;padding:4px 12px;border-radius:20px;margin-top:8px;}
footer{text-align:center;padding:24px 20px;color:var(--muted);font-size:13px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1}}
.fade{animation:fadeUp .4s ease;}

/* Blocked screen */
.blocked-wrap{max-width:600px;margin:60px auto;padding:40px;background:var(--card-bg);border-radius:16px;box-shadow:var(--shadow);text-align:center;}
.blocked-wrap .icon-big{font-size:64px;margin-bottom:16px;}
.blocked-wrap h1{color:var(--red);margin-bottom:12px;font-size:22px;}
.blocked-wrap p{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:24px;}

@media(max-width:700px){
  .exam-paper{padding:30px 20px;margin:15px;}
  .nav-bar{padding:0 20px;}
  .question-body{flex-direction:column;padding-left:0;}
  .question-media{width:100%;}
  .options{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:1fr;}
  .question-instruction{font-size:12px;padding:8px 12px;}
  .question-num{min-width:auto;padding-top:0;margin-bottom:8px;}
}
</style>
</head>
<body>

<div class="exam-info" id="examInfo" style="display:none;">
  <div class="item">📝 Soal <strong id="curNum">1</strong> / <strong id="totNum">-</strong></div>
  <div class="item">✅ Terjawab: <strong id="answeredNum">0</strong></div>
  <button class="btn-icon" onclick="toggleTheme()" title="Toggle dark mode"><i class="fas fa-moon" id="themeIcon"></i></button>
  <div class="timer" id="timerBox"><i class="fas fa-clock"></i> <span id="timerText">--:--</span></div>
</div>
<div class="progress-wrap" id="progressWrap" style="display:none;">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div id="app">
  <div class="spinner-container">
    <div class="spinner"></div>
    <p>Memuat...</p>
  </div>
</div>

<footer>한국어능력시험 (EPS-TOPIK) — 쓰기</footer>

<script>
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const icon = document.getElementById('themeIcon');
  if (icon) icon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
}
applyTheme(localStorage.getItem('theme') || 'light');

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwGsUnn93GQGnCGYITxYas-ig5BGa0O1191cxp_wNjeESRYsCJZgsYXClQNKGSyDAjQ/exec';

const _user = JSON.parse(localStorage.getItem('user') || 'null');
if (!_user) location.href = 'login.html';

const params = new URLSearchParams(location.search);
const kategori = params.get('kategori') || 'eps';

let questions = [];
let currentIndex = 0;
let answers = {};
let startTime = null;
let timerInterval = null;
let examDuration = 20 * 60;
let isFinished = false;
let resultSaved = false;

const CIRCLES = { '1':'①', '2':'②', '3':'③', '4':'④' };

// ===== ESCAPE HTML =====
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str == null ? '' : str);
  return div.innerHTML;
}

// ===== CHECK QUOTA =====
async function checkQuota() {
  if (_user.role === 'admin') return true;

  try {
    const r = await fetch(APPS_SCRIPT_URL + '?action=getQuota&username=' + encodeURIComponent(_user.username) + '&t=' + Date.now());
    const res = await r.json();
    if (res.success) {
      _user.quotaUsed = res.quotaUsed;
      _user.quotaMax = res.quotaMax;
      localStorage.setItem('user', JSON.stringify(_user));
      return res.canExam;
    }
  } catch(e) {}
  return true;
}

function showBlockedScreen() {
  document.getElementById('examInfo').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="blocked-wrap fade">
      <div class="icon-big">🔒</div>
      <h1>Kuota Ujian Habis</h1>
      <p>
        Kamu sudah menggunakan semua kuota ujian.<br>
        Silakan request tambah kuota ke admin melalui dashboard.
      </p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <a href="dashboard.html" class="btn btn-primary"><i class="fas fa-home"></i> Ke Dashboard</a>
      </div>
    </div>`;
}

// ===== LOAD =====
async function loadQuestions() {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="spinner-container"><div class="spinner"></div><p>Memeriksa kuota...</p></div>`;

  const canExam = await checkQuota();
  if (!canExam) {
    showBlockedScreen();
    return;
  }

  app.innerHTML = `<div class="spinner-container"><div class="spinner"></div><p>Memuat soal ujian...</p></div>`;
  const url = APPS_SCRIPT_URL + '?action=getData&kategori=' + encodeURIComponent(kategori) + '&t=' + Date.now();
  fetch(url)
    .then(res => { if (!res.ok) throw new Error('Network error'); return res.json(); })
    .then(data => {
      if (Array.isArray(data) && data.length > 0) {
        questions = data;
        startExam();
      } else {
        app.innerHTML = `
          <div class="result-wrap">
            <h1>📭 Belum Ada Soal</h1>
            <p class="sub">Kategori "${kategori}" belum punya soal.</p>
            <a href="dashboard.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Kembali</a>
          </div>`;
      }
    })
    .catch(() => {
      app.innerHTML = `
        <div class="result-wrap">
          <h1>⚠️ Gagal Memuat Soal</h1>
          <p class="sub">Periksa koneksi internet Anda</p>
          <button class="btn btn-primary" onclick="loadQuestions()"><i class="fas fa-redo"></i> Coba Lagi</button>
        </div>`;
    });
}

function startExam() {
  currentIndex = 0;
  answers = {};
  isFinished = false;
  resultSaved = false;
  startTime = Date.now();
  examDuration = Math.max(questions.length * 60, 300);

  document.getElementById('examInfo').style.display = 'flex';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('totNum').textContent = questions.length;

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  renderQuestion();
}

function updateTimer() {
  if (isFinished) return;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const remaining = examDuration - elapsed;
  const box = document.getElementById('timerBox');
  const text = document.getElementById('timerText');
  if (remaining <= 0) { clearInterval(timerInterval); finishExam(true); return; }
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  text.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  box.classList.remove('warning','danger');
  if (remaining <= 60) box.classList.add('danger');
  else if (remaining <= 300) box.classList.add('warning');
}

function renderQuestion() {
  const app = document.getElementById('app');
  const q = questions[currentIndex];
  const total = questions.length;

  document.getElementById('curNum').textContent = currentIndex + 1;
  const answeredCount = Object.keys(answers).filter(k => answers[k] !== '' && answers[k] !== undefined).length;
  document.getElementById('answeredNum').textContent = answeredCount;
  document.getElementById('progressFill').style.width = ((currentIndex + 1) / total) * 100 + '%';

  // ⚡ Instruksi (dari admin)
  const instruksiHtml = q.instruksi
    ? `<div class="question-instruction">${escapeHtml(q.instruksi)}</div>`
    : '';

  let mediaHtml = '';
  if (q.gambar) mediaHtml += `<img src="${q.gambar}" alt="gambar soal" onerror="this.style.display='none'">`;
  if (q.audio) mediaHtml += `<audio controls preload="metadata" style="width:100%;"><source src="${q.audio}"></audio>`;

  let optionsHtml = '';
  if (q.section === 'isian') {
    const val = (answers[currentIndex] || '').replace(/"/g, '&quot;');
    optionsHtml = `<input type="text" class="fill-input" id="fillInput" placeholder="답을 입력하세요..." value="${val}" oninput="saveAnswer(this.value)">`;
  } else {
    const opts = [
      { n:'1', t:q.opsiA, img:q.opsiAImg },
      { n:'2', t:q.opsiB, img:q.opsiBImg },
      { n:'3', t:q.opsiC, img:q.opsiCImg },
      { n:'4', t:q.opsiD, img:q.opsiDImg }
    ].filter(o => o.t || o.img);

    const cls = (q.section === 'pilihan_gambar') ? '' : 'vertical';
    optionsHtml = `<ul class="options ${cls}">`;
    opts.forEach(o => {
      const sel = String(answers[currentIndex]) === o.n ? 'selected' : '';

      const contentHtml = o.img
        ? `<img src="${o.img}" style="max-width:100%;max-height:80px;border-radius:6px;object-fit:contain;" onerror="this.style.display='none';this.nextSibling.style.display='inline'"><span style="display:none;">${escapeHtml(o.t || '')}</span>`
        : `<span>${escapeHtml(o.t || '')}</span>`;

      optionsHtml += `
        <li class="${sel}" onclick="selectAnswer('${o.n}')">
          <span class="circle">${CIRCLES[o.n]}</span>
          ${contentHtml}
        </li>`;
    });
    optionsHtml += '</ul>';
  }

  // ⚡ Nomor soal dipindah KE DALAM question-body
  const hasMedia = mediaHtml !== '';
  const numHtml = `<div class="question-num">${currentIndex + 1}</div>`;

  const contentHtml = `
    ${instruksiHtml}
    ${q.soal ? `<div class="question-text">${escapeHtml(q.soal)}</div>` : ''}
    ${optionsHtml}
  `;

  const bodyHtml = hasMedia
    ? `<div class="question-body">
         ${numHtml}
         <div class="question-media">${mediaHtml}</div>
         <div class="question-content">${contentHtml}</div>
       </div>`
    : `<div class="question-body">
         ${numHtml}
         <div class="question-content" style="flex:1;">${contentHtml}</div>
       </div>`;

  const isFirst = currentIndex === 0;
  const isLast = currentIndex === total - 1;

  app.innerHTML = `
    <div class="exam-paper fade" id="paper">
      <div class="exam-title">고용허가제 한국어능력시험 (EPS-TOPIK)</div>
      <div class="question">
        ${bodyHtml}
      </div>
    </div>
    <div class="nav-bar">
      <button class="btn btn-secondary" onclick="prevQuestion()" ${isFirst ? 'disabled' : ''}><i class="fas fa-arrow-left"></i> 이전</button>
      ${isLast
        ? `<button class="btn btn-success" onclick="finishExam(false)"><i class="fas fa-check"></i> 제출 & 결과보기</button>`
        : `<button class="btn btn-primary" onclick="nextQuestion()">다음 <i class="fas fa-arrow-right"></i></button>`}
    </div>`;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function selectAnswer(num) {
  answers[currentIndex] = num;
  document.querySelectorAll('.options li').forEach(li => {
    const circle = li.querySelector('.circle').textContent;
    li.classList.toggle('selected', circle === CIRCLES[num]);
  });
  updateAnsweredCount();
}
function saveAnswer(val) { answers[currentIndex] = val; updateAnsweredCount(); }
function updateAnsweredCount() {
  const n = Object.keys(answers).filter(k => answers[k] !== '' && answers[k] !== undefined).length;
  document.getElementById('answeredNum').textContent = n;
}
function nextQuestion() { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

function finishExam(timeUp) {
  if (isFinished) return;
  if (!timeUp && !confirm('Yakin ingin menyelesaikan ujian dan lihat hasil?')) return;

  isFinished = true;
  clearInterval(timerInterval);

  let correct = 0, wrong = 0, blank = 0;
  let benarL = 0, totalL = 0, benarR = 0, totalR = 0;

  questions.forEach((q, i) => {
    const ua = (answers[i] || '').toString().trim();
    const ca = (q.jawaban || '').toString().trim();
    const qKat = String(q.kategori || '').toLowerCase();
    const isListening = qKat === 'listening';
    if (isListening) totalL++; else totalR++;
    if (!ua) { blank++; return; }
    let isCorrect = false;
    if (q.section === 'isian') isCorrect = ua.toLowerCase() === ca.toLowerCase();
    else isCorrect = ua === ca;
    if (isCorrect) { correct++; if (isListening) benarL++; else benarR++; }
    else wrong++;
  });

  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  const skorL = totalL > 0 ? Math.round((benarL / totalL) * 100) : null;
  const skorR = totalR > 0 ? Math.round((benarR / totalR) * 100) : null;

  document.getElementById('examInfo').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';

  let grade = 'A', color = '#2fa36b';
  if (score < 90) { grade = 'B'; color = '#2fa36b'; }
  if (score < 80) { grade = 'C'; color = '#f0ad4e'; }
  if (score < 70) { grade = 'D'; color = '#f0ad4e'; }
  if (score < 60) { grade = 'E'; color = '#d9534f'; }

  const canCert = score >= 70;
  const katLabel = formatKategori(kategori);

  let breakdownHtml = '';
  if (totalL > 0 || totalR > 0) {
    breakdownHtml = `<div class="stat-grid" style="grid-template-columns:1fr 1fr;margin-top:8px;">
      <div class="stat" style="background:linear-gradient(135deg,#7c4dff,#5e35b1);color:#fff;">
        <div class="n" style="color:#fff;">${skorL !== null ? skorL : '-'}</div>
        <div class="l" style="color:rgba(255,255,255,.85);">🎧 LISTENING</div>
      </div>
      <div class="stat" style="background:linear-gradient(135deg,#26a69a,#00796b);color:#fff;">
        <div class="n" style="color:#fff;">${skorR !== null ? skorR : '-'}</div>
        <div class="l" style="color:rgba(255,255,255,.85);">📖 READING</div>
      </div>
    </div>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="result-wrap fade">
      <h1>Ujian Selesai 🎉</h1>
      <p class="sub">${timeUp ? '⏰ Waktu habis' : 'Terima kasih telah mengerjakan'} — ${katLabel}</p>
      <div class="score-big" style="background:${color}"><div class="num">${score}</div><div class="lbl">SKOR AKHIR</div></div>
      <p style="font-size:18px;font-weight:700;color:${color};margin-bottom:20px;">Grade ${grade}</p>

      ${breakdownHtml}

      <div class="stat-grid">
        <div class="stat green"><div class="n">${correct}</div><div class="l">정답 (Benar)</div></div>
        <div class="stat red"><div class="n">${wrong}</div><div class="l">오답 (Salah)</div></div>
        <div class="stat gray"><div class="n">${blank}</div><div class="l">미응답 (Kosong)</div></div>
      </div>

      <div id="saveStatus" style="text-align:center;"></div>
      ${canCert ? `<div class="cert-hint"><i class="fas fa-award"></i><div style="text-align:left;"><strong>Selamat! 🎉</strong><br>Kamu bisa cetak sertifikat di halaman Riwayat.</div></div>` : ''}

      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;">
        <a href="dashboard.html" class="btn btn-secondary"><i class="fas fa-home"></i> Dashboard</a>
        <a href="riwayat.html" class="btn btn-warning"><i class="fas fa-history"></i> Riwayat</a>
        <button class="btn btn-success" onclick="showReview()"><i class="fas fa-list"></i> Review Jawaban</button>
      </div>
      <div id="reviewBox" style="display:none;margin-top:28px;"></div>
    </div>`;
  window.scrollTo({top: 0, behavior: 'smooth'});

  saveResultToServer(score, correct, wrong, blank, total, benarL, totalL, benarR, totalR);
}

function formatKategori(k) {
  const map = { 'eps':'Soal EPS-TOPIK','kosakata':'Kosakata','tata_bahasa':'Tata Bahasa','listening':'Listening','reading':'Reading','umum':'Umum' };
  return map[k] || k || 'Umum';
}

function saveResultToServer(skor, benar, salah, kosong, total, benarL, totalL, benarR, totalR) {
  if (resultSaved) return;
  resultSaved = true;
  const statusBox = document.getElementById('saveStatus');
  if (statusBox) statusBox.innerHTML = '<span class="saved-badge"><i class="fas fa-spinner fa-spin"></i> Menyimpan hasil...</span>';

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'saveResult',
      username: _user.username,
      kategori: kategori,
      skor, benar, salah, kosong, total,
      benarListening: benarL, totalListening: totalL,
      benarReading: benarR, totalReading: totalR
    })
  })
  .then(r => r.text())
  .then(text => {
    let res; try { res = JSON.parse(text); } catch(e) { res = { success: false }; }
    if (statusBox) {
      if (res.success) {
        _user.quotaUsed = res.quotaUsed;
        _user.quotaMax = res.quotaMax;
        localStorage.setItem('user', JSON.stringify(_user));
        const remain = res.remaining;
        const remainText = remain > 0
          ? ` · Sisa kuota: ${remain}`
          : ' · ⚠️ Kuota habis';
        statusBox.innerHTML = `<span class="saved-badge"><i class="fas fa-check"></i> Hasil tersimpan${remainText}</span>`;
      } else {
        statusBox.innerHTML = '<span class="saved-badge" style="background:#fde8e8;color:#a33;"><i class="fas fa-times"></i> ' + (res.msg || 'Gagal simpan hasil') + '</span>';
      }
    }
  })
  .catch(() => {
    if (statusBox) statusBox.innerHTML = '<span class="saved-badge" style="background:#fde8e8;color:#a33;"><i class="fas fa-times"></i> Gagal simpan hasil</span>';
  });
}

function showReview() {
  const box = document.getElementById('reviewBox');
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  let html = '';
  questions.forEach((q, i) => {
    const ua = (answers[i] || '').toString().trim();
    const ca = (q.jawaban || '').toString().trim();
    let ok = false;
    if (q.section === 'isian') ok = ua.toLowerCase() === ca.toLowerCase();
    else ok = ua === ca;
    const dispUA = (q.section === 'isian') ? (ua || '(kosong)') : (CIRCLES[ua] || ua || '(kosong)');
    const dispCA = (q.section === 'isian') ? ca : (CIRCLES[ca] || ca);
    const instruksiHtml = q.instruksi
      ? `<div class="rinstruksi">📌 ${escapeHtml(q.instruksi)}</div>`
      : '';
    html += `
      <div class="review-item ${ok ? 'correct' : 'wrong'}">
        <div class="rhead">
          <span>Soal ${i + 1} ${q.kategori ? `· ${escapeHtml(q.kategori)}` : ''}</span>
          <span class="${ok ? 'ok' : 'no'}">${ok ? '✓ Benar' : '✗ Salah'}</span>
        </div>
        ${instruksiHtml}
        <div class="rq">${q.soal ? escapeHtml(q.soal) : '(gambar/audio)'}</div>
        <div class="ra">Jawaban Anda: <strong>${escapeHtml(dispUA)}</strong><br>Jawaban Benar: <strong style="color:var(--green);">${escapeHtml(dispCA)}</strong>${q.pembahasan ? `<br><br><strong>Pembahasan:</strong> ${escapeHtml(q.pembahasan)}` : ''}</div>
      </div>`;
  });
  box.innerHTML = html;
  box.style.display = 'block';
}

loadQuestions();
</script>
