<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profil — EPS-TOPIK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#fafafa;
  --card-bg:#ffffff;
  --text:#1a1a1a;
  --muted:#8a8a8a;
  --border:#e5e5e5;
  --accent:#2563eb;
  --accent-hover:#1d4ed8;
  --sub-bg:#f5f5f5;
  --input-bg:#ffffff;
  --red:#dc2626;
  --green:#16a34a;
  --yellow:#d97706;
}
[data-theme="dark"]{
  --bg:#0f0f0f;
  --card-bg:#1a1a1a;
  --text:#ededed;
  --muted:#888;
  --border:#2a2a2a;
  --accent:#5b9cff;
  --accent-hover:#7ab0ff;
  --sub-bg:#141414;
  --input-bg:#141414;
  --red:#f87171;
  --green:#4ade80;
  --yellow:#fbbf24;
}
*{margin:0;padding:0;box-sizing:border-box;
  font-family:-apple-system,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;}
body{
  background:var(--bg);
  min-height:100vh;
  color:var(--text);
  font-size:15px;
  line-height:1.6;
  transition:background .2s,color .2s;
}

/* ===== TOPBAR ===== */
.topbar{
  background:var(--card-bg);
  padding:14px 24px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:10;
}
.topbar h1{
  font-size:16px;
  color:var(--text);
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
}
.topbar h1 i{color:var(--muted);font-size:14px;}
.topbar .spacer{flex:1;}

/* ===== BUTTONS ===== */
.btn{
  padding:9px 16px;
  border:none;
  border-radius:8px;
  font-weight:500;
  font-size:13px;
  cursor:pointer;
  transition:.15s;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:inherit;
  text-decoration:none;
}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);}
.btn-secondary{
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover:not(:disabled){background:var(--sub-bg);border-color:var(--muted);}
.btn-success{background:var(--green);color:#fff;}
.btn-success:hover:not(:disabled){filter:brightness(1.1);}
.btn-warning{background:var(--yellow);color:#fff;}
.btn-warning:hover:not(:disabled){filter:brightness(1.1);}
.btn-sm{padding:7px 12px;font-size:12px;}

.btn-icon{
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  width:36px;height:36px;border-radius:50%;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;transition:.15s;
}
.btn-icon:hover{color:var(--text);border-color:var(--text);}

/* ===== LAYOUT ===== */
.wrap{
  max-width:720px;
  margin:32px auto;
  padding:0 20px;
}
.card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:24px;
  margin-bottom:16px;
}
.card h2{
  font-size:15px;
  color:var(--text);
  font-weight:600;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  gap:8px;
  padding-bottom:12px;
  border-bottom:1px solid var(--border);
}
.card h2 i{color:var(--muted);font-size:14px;}

/* ===== FIELDS ===== */
.field{margin-bottom:16px;}
.field label{
  font-size:13px;
  font-weight:500;
  color:var(--text);
  display:block;
  margin-bottom:6px;
}
.field input{
  width:100%;
  padding:10px 14px;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:14px;
  font-family:inherit;
  transition:.15s;
  background:var(--input-bg);
  color:var(--text);
}
.field input:focus{
  outline:none;
  border-color:var(--accent);
}
.field input:disabled{
  background:var(--sub-bg);
  color:var(--muted);
  cursor:not-allowed;
}
.field .hint{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

/* ===== EMAIL VERIFIED BADGE ===== */
.email-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:var(--sub-bg);
  color:var(--green);
  border:1px solid var(--border);
  padding:2px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:600;
  margin-left:6px;
  vertical-align:middle;
}
.email-badge i{font-size:9px;}

.email-wrapper{position:relative;}
.email-wrapper .verified-icon{
  position:absolute;
  right:14px;top:50%;transform:translateY(-50%);
  color:var(--green);
  font-size:14px;
  pointer-events:none;
}

/* ===== AVATAR ===== */
.avatar-section{
  display:flex;
  gap:24px;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.avatar-preview{
  width:110px;height:110px;border-radius:50%;
  object-fit:cover;
  border:1px solid var(--border);
  background:var(--sub-bg);
  display:flex;align-items:center;justify-content:center;
  font-size:38px;
  color:var(--muted);
  font-weight:600;
  flex-shrink:0;
}
.avatar-controls{flex:1;min-width:200px;}
.avatar-controls .btn{margin-right:6px;margin-bottom:6px;}
.upload-hint{
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
  line-height:1.5;
}

/* ===== MESSAGES ===== */
.msg{
  padding:10px 14px;
  border-radius:8px;
  font-size:13px;
  margin-bottom:16px;
  display:none;
  border:1px solid transparent;
}
.msg.err{
  background:var(--sub-bg);
  color:var(--red);
  border-color:var(--red);
  display:block;
}
.msg.ok{
  background:var(--sub-bg);
  color:var(--green);
  border-color:var(--green);
  display:block;
}
.msg.warn{
  background:var(--sub-bg);
  color:var(--yellow);
  border-color:var(--yellow);
  display:block;
}

/* ===== SPINNER ===== */
.spinner{
  display:inline-block;
  width:14px;height:14px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
}
@keyframes spin{100%{transform:rotate(360deg)}}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .topbar{padding:12px 16px;}
  .wrap{margin:20px auto;}
  .card{padding:18px;}
  .avatar-section{gap:16px;}
  .avatar-preview{width:88px;height:88px;font-size:30px;}
}
</style>
</head>
<body>

<div class="topbar">
  <h1><i class="fas fa-user-edit"></i> Edit Profil</h1>
  <div class="spacer"></div>
  <button class="btn-icon" onclick="toggleTheme()" title="Ganti tema">
    <i class="fas fa-moon" id="themeIcon"></i>
  </button>
  <a href="dashboard.html" class="btn btn-secondary btn-sm">
    <i class="fas fa-home"></i> Dashboard
  </a>
</div>

<div class="wrap">
  <div class="msg" id="msg"></div>

  <!-- FOTO PROFIL -->
  <div class="card">
    <h2><i class="fas fa-camera"></i> Foto Profil</h2>
    <div class="avatar-section">
      <div id="avatarBox" class="avatar-preview"></div>
      <div class="avatar-controls">
        <input type="file" id="fotoFile" accept="image/*" style="display:none;" onchange="onFilePick(this)">
        <button class="btn btn-primary" onclick="document.getElementById('fotoFile').click()">
          <i class="fas fa-upload"></i> Pilih Foto
        </button>
        <button class="btn btn-secondary" id="btnHapusFoto" onclick="hapusFoto()" style="display:none;">
          <i class="fas fa-trash"></i> Hapus
        </button>
        <button class="btn btn-success" id="btnUploadFoto" onclick="uploadFoto()" style="display:none;">
          <i class="fas fa-check"></i> Simpan Foto
        </button>
        <div class="upload-hint">
          Format: JPG / PNG / WEBP. Maks 2 MB. Foto ini akan muncul di sertifikat.
        </div>
      </div>
    </div>
  </div>

  <!-- DATA DIRI -->
  <div class="card">
    <h2><i class="fas fa-user"></i> Data Diri</h2>
    <div class="field">
      <label>Username (tidak bisa diubah)</label>
      <input type="text" id="profUsername" disabled>
    </div>

    <div class="field">
      <label>
        Email Terdaftar
        <span class="email-badge" id="emailBadge" style="display:none;">
          <i class="fas fa-check-circle"></i> Terverifikasi
        </span>
      </label>
      <div class="email-wrapper">
        <input type="email" id="profEmail" disabled placeholder="Belum ada email">
        <i class="fas fa-check-circle verified-icon" id="emailVerifiedIcon" style="display:none;"></i>
      </div>
      <div class="hint">
        <i class="fas fa-info-circle"></i> Email ini dipakai untuk login & notifikasi. Kalau mau ganti, hubungi admin.
      </div>
    </div>

    <div class="field">
      <label>Nama Lengkap</label>
      <input type="text" id="profNama" placeholder="Nama kamu">
      <div class="hint">Nama ini akan muncul di sertifikat</div>
    </div>
    <button class="btn btn-primary" onclick="simpanNama()">
      <i class="fas fa-save"></i> Simpan Nama
    </button>
  </div>

  <!-- GANTI PASSWORD -->
  <div class="card">
    <h2><i class="fas fa-lock"></i> Ganti Password</h2>
    <div class="field">
      <label>Password Lama</label>
      <input type="password" id="oldPass" placeholder="••••••••">
    </div>
    <div class="field">
      <label>Password Baru</label>
      <input type="password" id="newPass" placeholder="minimal 4 karakter">
    </div>
    <div class="field">
      <label>Konfirmasi Password Baru</label>
      <input type="password" id="newPass2" placeholder="ulangi password baru">
    </div>
    <button class="btn btn-warning" onclick="gantiPassword()">
      <i class="fas fa-key"></i> Ganti Password
    </button>
  </div>
</div>

<script>
// ===== THEME =====
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const icon = document.getElementById('themeIcon');
  if (icon) icon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
}
applyTheme(localStorage.getItem('theme') || 'light');

const API = 'https://script.google.com/macros/s/AKfycbyKZQU0IFhCrTBD1Jk7imOEuOLSBjGE962ZgSThd52ltWL_4mMvwOxNgUe3EuZA3k7e/exec';

const user = JSON.parse(localStorage.getItem('user') || 'null');
if (!user) location.href = 'login.html';

let currentFoto = user.foto || '';
let pendingFile = null;

function renderAvatar() {
  const box = document.getElementById('avatarBox');
  if (currentFoto) {
    box.innerHTML = `<img src="${currentFoto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
    document.getElementById('btnHapusFoto').style.display = 'inline-flex';
  } else {
    const init = (user.nama || user.username).charAt(0).toUpperCase();
    box.innerHTML = init;
    document.getElementById('btnHapusFoto').style.display = 'none';
  }
}

function renderEmail(email) {
  const emailInput = document.getElementById('profEmail');
  const badge = document.getElementById('emailBadge');
  const icon = document.getElementById('emailVerifiedIcon');

  if (email) {
    emailInput.value = email;
    badge.style.display = 'inline-flex';
    icon.style.display = 'block';
  } else {
    emailInput.value = '';
    emailInput.placeholder = 'Belum ada email terdaftar';
    badge.style.display = 'none';
    icon.style.display = 'none';
  }
}

document.getElementById('profUsername').value = user.username;
document.getElementById('profNama').value = user.nama || user.username;
renderAvatar();
renderEmail(user.email || '');

// Auto-fetch email kalau belum ada di localStorage
if (!user.email) {
  fetch(API + '?action=getProfile&username=' + encodeURIComponent(user.username) + '&t=' + Date.now())
    .then(r => r.json())
    .then(res => {
      if (res.success && res.user) {
        user.email = res.user.email || '';
        user.nama = res.user.nama || user.nama;
        user.foto = res.user.foto || user.foto;
        localStorage.setItem('user', JSON.stringify(user));
        renderEmail(user.email);
        document.getElementById('profNama').value = user.nama || user.username;
        currentFoto = user.foto || '';
        renderAvatar();
      }
    })
    .catch(() => {});
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (type || '');
  if (text) setTimeout(() => { el.className = 'msg'; }, 4000);
}

async function post(payload) {
  const r = await fetch(API, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  const t = await r.text();
  try { return JSON.parse(t); } catch(e) { return { success:false, msg:'Response tidak valid' }; }
}

// ===== FOTO =====
function onFilePick(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    showMsg('Ukuran foto maksimal 2 MB', 'err');
    return;
  }

  const reader = new FileReader();
  reader.onload = e => {
    const box = document.getElementById('avatarBox');
    box.innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
    pendingFile = file;
    document.getElementById('btnUploadFoto').style.display = 'inline-flex';
    showMsg('Foto siap. Klik "Simpan Foto" untuk mengupload.', 'ok');
  };
  reader.readAsDataURL(file);
}

async function uploadFoto() {
  if (!pendingFile) return;
  const btn = document.getElementById('btnUploadFoto');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Upload...';

  try {
    const base64 = await fileToBase64(pendingFile);
    const upRes = await post({
      action: 'upload',
      username: user.username,
      filename: 'profile_' + user.username + '_' + Date.now() + '_' + pendingFile.name,
      base64: base64
    });

    if (!upRes.success || !upRes.url) {
      throw new Error(upRes.msg || 'Upload gagal');
    }

    const profRes = await post({
      action: 'updateProfile',
      username: user.username,
      nama: user.nama,
      foto: upRes.url
    });

    if (!profRes.success) throw new Error(profRes.msg || 'Update profil gagal');

    user.foto = upRes.url;
    localStorage.setItem('user', JSON.stringify(user));
    currentFoto = upRes.url;
    pendingFile = null;
    document.getElementById('btnUploadFoto').style.display = 'none';
    renderAvatar();
    showMsg('Foto profil berhasil disimpan!', 'ok');
  } catch(err) {
    showMsg(err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result.split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function hapusFoto() {
  if (!confirm('Hapus foto profil?')) return;
  try {
    const res = await post({
      action: 'updateProfile',
      username: user.username,
      nama: user.nama,
      foto: 'HAPUS'
    });
    if (res.success) {
      user.foto = '';
      localStorage.setItem('user', JSON.stringify(user));
      currentFoto = '';
      renderAvatar();
      showMsg('Foto profil dihapus', 'ok');
    } else {
      showMsg(res.msg || 'Gagal hapus', 'err');
    }
  } catch(err) {
    showMsg(err.message, 'err');
  }
}

// ===== NAMA =====
async function simpanNama() {
  const newNama = document.getElementById('profNama').value.trim();
  if (!newNama) { showMsg('Nama tidak boleh kosong', 'err'); return; }
  try {
    const res = await post({
      action: 'updateProfile',
      username: user.username,
      nama: newNama
    });
    if (res.success) {
      user.nama = newNama;
      localStorage.setItem('user', JSON.stringify(user));
      renderAvatar();
      showMsg('Nama berhasil diupdate', 'ok');
    } else {
      showMsg(res.msg || 'Gagal simpan', 'err');
    }
  } catch(err) {
    showMsg(err.message, 'err');
  }
}

// ===== PASSWORD =====
async function gantiPassword() {
  const oldPass = document.getElementById('oldPass').value;
  const newPass = document.getElementById('newPass').value;
  const newPass2 = document.getElementById('newPass2').value;

  if (!oldPass || !newPass || !newPass2) { showMsg('Isi semua field', 'err'); return; }
  if (newPass.length < 4) { showMsg('Password baru minimal 4 karakter', 'err'); return; }
  if (newPass !== newPass2) { showMsg('Konfirmasi password tidak sama', 'err'); return; }

  try {
    const res = await post({
      action: 'changePassword',
      username: user.username,
      oldPassword: oldPass,
      newPassword: newPass
    });
    if (res.success) {
      document.getElementById('oldPass').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('newPass2').value = '';
      showMsg('Password berhasil diganti', 'ok');
    } else {
      showMsg(res.msg || 'Gagal ganti password', 'err');
    }
  } catch(err) {
    showMsg(err.message, 'err');
  }
}
</script>
</body>
</html>
