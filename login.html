<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — EPS-TOPIK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#fafafa;
  --card-bg:#ffffff;
  --text:#1a1a1a;
  --muted:#8a8a8a;
  --border:#e5e5e5;
  --accent:#2563eb;
  --accent-hover:#1d4ed8;
  --input-bg:#ffffff;
  --input-border:#e0e0e0;
}
[data-theme="dark"]{
  --bg:#0f0f0f;
  --card-bg:#1a1a1a;
  --text:#ededed;
  --muted:#888;
  --border:#2a2a2a;
  --accent:#5b9cff;
  --accent-hover:#7ab0ff;
  --input-bg:#141414;
  --input-border:#2e2e2e;
}
*{margin:0;padding:0;box-sizing:border-box;
  font-family:-apple-system,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;}
body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  transition:background .2s;
  font-size:15px;
  line-height:1.6;
}
.theme-toggle{
  position:fixed;top:20px;right:20px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  width:40px;height:40px;border-radius:50%;
  cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;
}
.theme-toggle:hover{color:var(--text);border-color:var(--text);}

.box{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:44px 36px;
  width:100%;
  max-width:400px;
}
.box .logo{
  text-align:center;
  font-size:32px;
  margin-bottom:16px;
  line-height:1;
}
.box h1{
  text-align:center;
  color:var(--text);
  margin-bottom:6px;
  font-size:20px;
  font-weight:600;
  letter-spacing:-0.2px;
}
.box .sub{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:32px;
}

.field{margin-bottom:16px;}
.field label{
  font-size:13px;
  font-weight:500;
  color:var(--text);
  display:block;
  margin-bottom:6px;
}
.field label .req{color:#dc2626;margin-left:2px;}
.input-wrap{position:relative;}
.input-wrap input{
  width:100%;
  padding:11px 44px 11px 14px;
  border:1px solid var(--input-border);
  border-radius:8px;
  font-size:14px;
  font-family:inherit;
  background:var(--input-bg);
  color:var(--text);
  transition:border-color .15s;
}
.input-wrap input:focus{
  outline:none;
  border-color:var(--accent);
}
.input-wrap input::placeholder{color:var(--muted);opacity:.7;}
.input-wrap input.valid:not(:placeholder-shown){border-color:#16a34a;}
.input-wrap input:invalid:not(:placeholder-shown):not(:focus){border-color:#dc2626;}

.input-wrap .eye-btn{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:transparent;border:none;cursor:pointer;
  color:var(--muted);font-size:14px;padding:8px;
  border-radius:6px;transition:color .15s;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.input-wrap .eye-btn:hover{color:var(--text);}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
  font-weight:500;
  font-size:14px;
  cursor:pointer;
  margin-top:8px;
  font-family:inherit;
  transition:background .15s;
}
.btn:hover:not(:disabled){background:var(--accent-hover);}
.btn:disabled{opacity:.6;cursor:not-allowed;}

.msg{
  padding:10px 14px;
  border-radius:8px;
  font-size:13px;
  margin-bottom:20px;
  display:none;
  border:1px solid transparent;
}
.msg.err{background:#fef2f2;color:#b91c1c;border-color:#fecaca;display:block;}
.msg.ok{background:#f0fdf4;color:#15803d;border-color:#bbf7d0;display:block;}
.msg.warn{background:#fffbeb;color:#a16207;border-color:#fde68a;display:block;}
[data-theme="dark"] .msg.err{background:#2a1515;color:#f87171;border-color:#4a2020;}
[data-theme="dark"] .msg.ok{background:#0f2418;color:#4ade80;border-color:#1e4030;}
[data-theme="dark"] .msg.warn{background:#2a2210;color:#fbbf24;border-color:#4a3a15;}

.spinner{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
}
@keyframes spin{100%{transform:rotate(360deg)}}

.signup-row{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  margin-top:20px;
}
.signup-row a{
  color:var(--accent);
  text-decoration:none;
  font-weight:500;
  cursor:pointer;
}
.signup-row a:hover{text-decoration:underline;}

.forgot{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:14px;
}

.field-hint{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}
.field-hint.ok{color:#16a34a;}
.field-hint.err{color:#dc2626;}

.footer-txt{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:28px;
  padding-top:20px;
  border-top:1px solid var(--border);
}
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" title="Ganti tema">
  <i class="fas fa-moon" id="themeIcon"></i>
</button>

<div class="box">
  <div class="logo">🇰🇷</div>
  <h1>EPS-TOPIK</h1>
  <p class="sub" id="subtitle">Masuk untuk mulai latihan</p>

  <div class="msg" id="msg"></div>

  <!-- ============ FORM LOGIN ============ -->
  <form id="formLogin" onsubmit="doLogin(event)" autocomplete="on">
    <div class="field">
      <label>Username</label>
      <div class="input-wrap">
        <input type="text" id="loginUser" required autocomplete="username" placeholder="username kamu">
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="loginPass" required autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="eye-btn" data-target="loginPass" onclick="togglePassword(event, this)" title="Lihat password">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <button class="btn" id="btnLogin" type="submit">Masuk</button>

    <p class="signup-row">Belum punya akun? <a onclick="switchMode('register')">Daftar</a></p>
    <p class="forgot">Lupa password? Hubungi admin.</p>
  </form>

  <!-- ============ FORM REGISTER ============ -->
  <form id="formRegister" onsubmit="doRegister(event)" style="display:none;" autocomplete="on">
    <div class="field">
      <label>Nama Lengkap <span class="req">*</span></label>
      <div class="input-wrap">
        <input type="text" id="regNama" required placeholder="Nama kamu" autocomplete="name" minlength="2">
      </div>
    </div>

    <div class="field">
      <label>Email <span class="req">*</span></label>
      <div class="input-wrap">
        <input type="email" id="regEmail" required placeholder="email@example.com" autocomplete="email" oninput="validateEmail(this)">
      </div>
      <div class="field-hint" id="emailHint"></div>
    </div>

    <div class="field">
      <label>Username <span class="req">*</span></label>
      <div class="input-wrap">
        <input type="text" id="regUser" required minlength="3" placeholder="minimal 3 karakter" autocomplete="username" pattern="[a-zA-Z0-9_.]+" title="Hanya huruf, angka, titik, underscore">
      </div>
    </div>

    <div class="field">
      <label>Password <span class="req">*</span></label>
      <div class="input-wrap">
        <input type="password" id="regPass" required minlength="4" placeholder="minimal 4 karakter" autocomplete="new-password" oninput="validatePassword(this)">
        <button type="button" class="eye-btn" data-target="regPass" onclick="togglePassword(event, this)" title="Lihat password">
          <i class="fas fa-eye"></i>
        </button>
      </div>
      <div class="field-hint" id="passHint"></div>
    </div>

    <button class="btn" id="btnReg" type="submit">Daftar</button>

    <p class="signup-row">Sudah punya akun? <a onclick="switchMode('login')">Masuk</a></p>
  </form>

  <p class="footer-txt">© EPS-TOPIK Practice</p>
</div>

<script>
// ===== THEME =====
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const icon = document.getElementById('themeIcon');
  if (icon) icon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
}
applyTheme(localStorage.getItem('theme') || 'light');

// ===== SWITCH LOGIN <-> REGISTER =====
function switchMode(mode) {
  const isLogin = mode === 'login';
  document.getElementById('formLogin').style.display = isLogin ? 'block' : 'none';
  document.getElementById('formRegister').style.display = isLogin ? 'none' : 'block';
  document.getElementById('subtitle').textContent = isLogin
    ? 'Masuk untuk mulai latihan'
    : 'Buat akun baru untuk mulai latihan';
  showMsg('', '');
  window.scrollTo({top:0, behavior:'smooth'});
  setTimeout(() => {
    if (isLogin) document.getElementById('loginUser').focus();
    else document.getElementById('regNama').focus();
  }, 100);
}

// ===== SHOW/HIDE PASSWORD =====
function togglePassword(event, btn) {
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const input = document.getElementById(btn.dataset.target);
  if (!input) return;
  const isPassword = input.type === 'password';
  input.type = isPassword ? 'text' : 'password';
  const icon = btn.querySelector('i');
  if (icon) icon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
  btn.title = isPassword ? 'Sembunyikan password' : 'Lihat password';
  input.focus();
  const val = input.value;
  input.setSelectionRange(val.length, val.length);
}

// ===== VALIDASI =====
function validateEmail(el) {
  const hint = document.getElementById('emailHint');
  const v = el.value.trim();
  if (!v) {
    el.classList.remove('valid');
    hint.className = 'field-hint';
    hint.textContent = '';
    return;
  }
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  if (ok) {
    el.classList.add('valid');
    hint.className = 'field-hint ok';
    hint.textContent = 'Format email valid';
  } else {
    el.classList.remove('valid');
    hint.className = 'field-hint err';
    hint.textContent = 'Format email tidak valid';
  }
}

function validatePassword(el) {
  const hint = document.getElementById('passHint');
  const v = el.value;
  if (v.length >= 4) {
    el.classList.add('valid');
    hint.className = 'field-hint ok';
    hint.textContent = 'Password OK';
  } else {
    el.classList.remove('valid');
    hint.className = 'field-hint';
    hint.textContent = v.length ? `Minimal 4 karakter (${v.length}/4)` : '';
  }
}

const API = 'https://script.google.com/macros/s/AKfycbyKZQU0IFhCrTBD1Jk7imOEuOLSBjGE962ZgSThd52ltWL_4mMvwOxNgUe3EuZA3k7e/exec';

function resetWelcomeFlag() {
  try {
    sessionStorage.removeItem('welcome_shown');
    sessionStorage.removeItem('welcome_shown_at');
    sessionStorage.removeItem('welcome_shown_session');
    sessionStorage.setItem('login_session_id', Date.now().toString());
  } catch(e) {}
}

if (localStorage.getItem('user')) {
  resetWelcomeFlag();
  location.href = 'dashboard.html';
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (type || '');
}

async function post(payload) {
  const r = await fetch(API, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  const t = await r.text();
  try { return JSON.parse(t); } catch(e) { return { success:false, msg:'Response tidak valid' }; }
}

function detectMsgType(msg) {
  if (msg && (msg.includes('⚠️') || msg.toLowerCase().includes('terlalu banyak'))) return 'warn';
  return 'err';
}

// ===== LOGIN =====
async function doLogin(e) {
  e.preventDefault();
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('btnLogin');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Memproses...';
  showMsg('', '');
  try {
    const res = await post({ action:'login', username, password });
    if (res.success) {
      localStorage.setItem('user', JSON.stringify(res.user));
      resetWelcomeFlag();
      const roleLabel = res.user.role === 'admin' ? 'Admin' : 'Pelajar';
      showMsg(`Login berhasil sebagai ${roleLabel}. Mengalihkan...`, 'ok');
      setTimeout(() => location.href = 'dashboard.html', 700);
    } else {
      showMsg(res.msg || 'Login gagal', detectMsgType(res.msg));
    }
  } catch(err) {
    showMsg(err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

// ===== REGISTER =====
async function doRegister(e) {
  e.preventDefault();
  const nama = document.getElementById('regNama').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  const btn = document.getElementById('btnReg');
  const original = btn.innerHTML;

  if (!nama || nama.length < 2) { showMsg('Nama minimal 2 karakter', 'err'); return; }
  if (!email) { showMsg('Email wajib diisi', 'err'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showMsg('Format email tidak valid', 'err'); return; }
  if (!username || username.length < 3) { showMsg('Username minimal 3 karakter', 'err'); return; }
  if (!/^[a-zA-Z0-9_.]+$/.test(username)) { showMsg('Username hanya boleh huruf, angka, titik, underscore', 'err'); return; }
  if (!password || password.length < 4) { showMsg('Password minimal 4 karakter', 'err'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Memproses...';
  showMsg('', '');
  try {
    const res = await post({ action:'register', username, password, nama, email });
    if (res.success) {
      showMsg('Pendaftaran berhasil! Silakan masuk.', 'ok');
      document.getElementById('formRegister').reset();
      document.getElementById('regEmail').classList.remove('valid');
      document.getElementById('regPass').classList.remove('valid');
      document.getElementById('emailHint').textContent = '';
      document.getElementById('passHint').textContent = '';
      switchMode('login');
      document.getElementById('loginUser').value = username;
      document.getElementById('loginPass').focus();
    } else {
      showMsg(res.msg || 'Gagal daftar', detectMsgType(res.msg));
    }
  } catch(err) {
    showMsg(err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

// autofocus
setTimeout(() => document.getElementById('loginUser').focus(), 100);
</script>
</body>
</html>
