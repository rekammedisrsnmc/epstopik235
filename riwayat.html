<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat & Sertifikat — EPS-TOPIK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#f5f7fa; --card-bg:#fff; --card-shadow:0 4px 16px rgba(0,0,0,.06);
  --text:#333; --text-muted:#888; --title-color:#154a82; --link-color:#1e5fa8;
  --border:#d0d7e2; --topbar-bg:#fff; --topbar-shadow:0 4px 16px rgba(0,0,0,.08);
  --sub-bg:#f5f7fa; --stat-bg:#fff;
}
[data-theme="dark"]{
  --bg:#0a111f; --card-bg:#151d2e; --card-shadow:0 4px 16px rgba(0,0,0,.4);
  --text:#e8eef7; --text-muted:#8b9bb4; --title-color:#5b9cff; --link-color:#5b9cff;
  --border:#2a3448; --topbar-bg:#151d2e; --topbar-shadow:0 4px 16px rgba(0,0,0,.4);
  --sub-bg:#0f1626; --stat-bg:#1a2233;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Malgun Gothic',-apple-system,sans-serif;}
body{background:var(--bg);min-height:100vh;color:var(--text);transition:background .3s,color .3s;}
.topbar{background:var(--topbar-bg);padding:16px 24px;box-shadow:var(--topbar-shadow);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;flex-wrap:wrap;}
.topbar h1{font-size:18px;color:var(--title-color);display:flex;align-items:center;gap:10px;}
.topbar h1 i{color:var(--link-color);}
.topbar .spacer{flex:1;}
.topbar .user{font-size:13px;color:var(--text-muted);}
.topbar .user strong{color:var(--link-color);}
.btn{padding:10px 20px;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;transition:0.2s;display:inline-flex;align-items:center;gap:8px;font-family:inherit;text-decoration:none;}
.btn-primary{background:var(--link-color);color:#fff;}
.btn-primary:hover{filter:brightness(1.15);}
.btn-secondary{background:var(--sub-bg);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--border);}
.btn-warning{background:#f0ad4e;color:#fff;}
.btn-warning:hover{filter:brightness(1.1);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-icon{background:transparent;border:1.5px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.2s;}
.btn-icon:hover{background:var(--sub-bg);border-color:var(--link-color);color:var(--link-color);}
.wrap{max-width:1000px;margin:30px auto;padding:0 20px;}
.title{font-size:24px;color:var(--text);margin-bottom:6px;}
.title strong{color:var(--link-color);}
.sub{color:var(--text-muted);font-size:14px;margin-bottom:26px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px;}
.stat{background:var(--stat-bg);border-radius:12px;padding:20px;box-shadow:var(--card-shadow);text-align:center;}
.stat .n{font-size:28px;font-weight:800;color:var(--link-color);}
.stat .l{font-size:12px;color:var(--text-muted);margin-top:6px;}
.stat.green .n{color:#2fa36b;}
.stat.orange .n{color:#f0ad4e;}
.stat.purple .n{color:#7c4dff;}
.card{background:var(--card-bg);border-radius:12px;padding:24px;box-shadow:var(--card-shadow);margin-bottom:24px;}
.card h2{font-size:16px;color:var(--title-color);margin-bottom:18px;display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:2px solid var(--sub-bg);}
.hist-item{display:flex;align-items:center;gap:16px;padding:16px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px;transition:.2s;background:var(--card-bg);}
.hist-item:hover{border-color:var(--link-color);}
.hist-score{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0;}
.hist-score .n{font-size:20px;line-height:1;}
.hist-score .l{font-size:9px;letter-spacing:1px;opacity:.9;margin-top:2px;}
.hist-info{flex:1;min-width:0;}
.hist-info h3{font-size:15px;color:var(--text);margin-bottom:4px;text-transform:capitalize;}
.hist-info .meta{font-size:12px;color:var(--text-muted);display:flex;gap:12px;flex-wrap:wrap;}
.hist-info .meta span{display:flex;align-items:center;gap:4px;}
.hist-actions{display:flex;gap:8px;flex-shrink:0;}
.empty{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty i{font-size:56px;opacity:.3;display:block;margin-bottom:16px;}
.empty h3{color:var(--text);margin-bottom:8px;}
.empty p{font-size:13px;margin-bottom:20px;}

/* Sertifikat */
.cert-frame{background:#fff;border-radius:6px;padding:0;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.15);max-width:820px;margin:0 auto;overflow:hidden;border:1px solid #d0d7e2;color:#333;}
.cert-kop{display:flex;align-items:center;gap:16px;padding:20px 36px;background:linear-gradient(135deg,#154a82,#1e5fa8);color:#fff;}
.cert-kop .logo{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;border:2px solid rgba(255,255,255,.3);}
.cert-kop .kop-text{flex:1;}
.cert-kop .kop-text h1{font-size:15px;letter-spacing:2px;font-weight:800;line-height:1.2;}
.cert-kop .kop-text h2{font-size:13px;font-weight:600;opacity:.9;line-height:1.2;margin-top:2px;}
.cert-kop .kop-text p{font-size:10px;opacity:.75;margin-top:4px;letter-spacing:1px;}
.cert-strip{height:5px;background:linear-gradient(90deg,#f0ad4e,#f5d589,#f0ad4e,#f5d589);}
.cert-body{padding:30px 46px 40px;position:relative;}
.cert-title-block{text-align:center;margin-bottom:24px;}
.cert-title-block .en{font-size:13px;letter-spacing:4px;color:#888;text-transform:uppercase;font-weight:600;}
.cert-title-block .id{font-size:26px;letter-spacing:3px;color:#154a82;font-weight:800;margin-top:4px;}
.cert-title-block .kategori{display:inline-block;margin-top:8px;background:#e8f0fa;color:#1e5fa8;padding:4px 16px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1px;}
.cert-status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 18px;border-radius:20px;font-size:12px;font-weight:800;letter-spacing:1.5px;}
.cert-status.lulus{background:#e8f5ee;color:#1f7f53;border:2px solid #2fa36b;}
.cert-status.belum{background:#fde8e8;color:#a33;border:2px solid #d9534f;}
.cert-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 30px;margin-bottom:22px;}
.cert-field .lbl{font-size:10px;letter-spacing:1px;color:#888;text-transform:uppercase;font-weight:600;margin-bottom:4px;}
.cert-field .val{font-size:14px;color:#222;font-weight:700;padding-bottom:4px;border-bottom:1px solid #e4e8ee;}
.cert-field.full{grid-column:span 2;}
.cert-photo{width:100px;height:130px;border:2px solid #d0d7e2;border-radius:4px;background:linear-gradient(135deg,#f5f7fa,#e8f0fa);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa;font-size:10px;text-align:center;gap:4px;position:absolute;top:30px;right:46px;overflow:hidden;}
.cert-photo img{width:100%;height:100%;object-fit:cover;}
.cert-photo i{font-size:28px;color:#c0c8d4;}
.cert-nilai-title{text-align:center;font-size:11px;letter-spacing:3px;color:#888;text-transform:uppercase;font-weight:700;margin:24px 0 12px;position:relative;}
.cert-nilai-title::before,.cert-nilai-title::after{content:'';position:absolute;top:50%;width:30%;height:1px;background:#e4e8ee;}
.cert-nilai-title::before{left:0;}
.cert-nilai-title::after{right:0;}
.cert-nilai-grid{display:grid;gap:12px;margin-bottom:24px;}
.cert-nilai-grid.g3{grid-template-columns:repeat(3,1fr);}
.cert-nilai-grid.g4{grid-template-columns:repeat(4,1fr);}
.cert-nilai-grid.g2{grid-template-columns:repeat(2,1fr);}
.cert-nilai{text-align:center;padding:14px 8px;background:#f5f7fa;border-radius:8px;border:1px solid #e4e8ee;}
.cert-nilai .n{font-size:22px;font-weight:800;color:#1e5fa8;line-height:1;}
.cert-nilai .l{font-size:10px;color:#888;margin-top:6px;letter-spacing:1px;text-transform:uppercase;}
.cert-nilai.highlight{background:linear-gradient(135deg,#2fa36b,#1f7f53);border:none;}
.cert-nilai.highlight .n,.cert-nilai.highlight .l{color:#fff;}
.cert-nilai.highlight.warn{background:linear-gradient(135deg,#f0ad4e,#ec971f);}
.cert-nilai.highlight.fail{background:linear-gradient(135deg,#d9534f,#c9302c);}
.cert-nilai.listening{background:linear-gradient(135deg,#7c4dff,#5e35b1);border:none;}
.cert-nilai.listening .n,.cert-nilai.listening .l{color:#fff;}
.cert-nilai.reading{background:linear-gradient(135deg,#26a69a,#00796b);border:none;}
.cert-nilai.reading .n,.cert-nilai.reading .l{color:#fff;}
.cert-ket{background:linear-gradient(135deg,#fffbf0,#fff8e1);border-left:4px solid #f0ad4e;padding:14px 18px;border-radius:6px;font-size:13px;color:#5a4a1a;line-height:1.6;margin-bottom:24px;}
.cert-ket.fail{background:linear-gradient(135deg,#fde8e8,#fbdada);border-left-color:#d9534f;color:#7a2020;}
.cert-ket strong{color:#8a6a1a;}
.cert-ket.fail strong{color:#a33;}
.cert-footer{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-top:20px;border-top:1px dashed #d0d7e2;font-size:12px;color:#555;}
.cert-footer .ttd-block{text-align:center;flex-shrink:0;}
.cert-footer .ttd-line{width:180px;height:50px;border-bottom:2px solid #333;margin-bottom:6px;position:relative;}
.cert-footer .ttd-line::after{content:'✍';position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:22px;color:#1e5fa8;opacity:.6;}
.cert-footer .ttd-name{font-weight:700;color:#222;font-size:13px;}
.cert-footer .ttd-role{font-size:11px;color:#888;margin-top:2px;}
.cert-footer .info-block{text-align:left;font-size:11px;color:#888;line-height:1.7;flex-shrink:0;}
.cert-footer .info-block strong{color:#333;font-size:13px;}
.cert-seal{display:flex;flex-direction:column;align-items:center;justify-content:center;width:82px;height:82px;border-radius:50%;border:3px solid #1e5fa8;color:#1e5fa8;font-size:9px;font-weight:800;letter-spacing:.5px;background:#fff;flex-shrink:0;transform:rotate(-12deg);box-shadow:0 4px 12px rgba(30,95,168,.15);margin-bottom:8px;}
.cert-seal i{font-size:22px;margin-bottom:2px;color:#f0ad4e;}
.cert-watermark{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:200px;color:#1e5fa8;opacity:.03;font-weight:900;letter-spacing:8px;}
.cert-actions{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap;}

@media print {
  body * { visibility: hidden; }
  #certificate, #certificate * { visibility: visible; }
  #certificate { position: absolute; left: 0; top: 0; width: 100%; }
  .topbar, .cert-actions, .btn, .title, .sub, .stats, .card, .no-print { display: none !important; }
  .wrap { margin: 0 !important; padding: 0 !important; max-width: 100% !important; }
  .cert-frame { box-shadow: none !important; border: 1px solid #ccc !important; margin: 0 auto !important; }
  @page { size: A4 portrait; margin: 0.5cm; }
}
@media(max-width:700px){
  .stats{grid-template-columns:repeat(2,1fr);}
  .hist-item{flex-wrap:wrap;}
  .cert-body{padding:20px;}
  .cert-kop{padding:14px 20px;}
  .cert-grid{grid-template-columns:1fr;}
  .cert-field.full{grid-column:span 1;}
  .cert-nilai-grid.g3,.cert-nilai-grid.g4{grid-template-columns:repeat(2,1fr);}
  .cert-photo{position:static;margin:0 auto 12px;}
  .cert-footer{flex-direction:column;gap:20px;align-items:center;}
  .cert-footer .info-block{text-align:center;}
  .cert-title-block .id{font-size:20px;letter-spacing:1px;}
}
</style>
</head>
<body>

<div class="topbar">
  <h1><i class="fas fa-history"></i> Riwayat & Sertifikat</h1>
  <div class="spacer"></div>
  <span class="user">👤 <strong id="userName">-</strong></span>
  <button class="btn-icon" onclick="toggleTheme()" title="Toggle dark mode"><i class="fas fa-moon" id="themeIcon"></i></button>
  <a href="dashboard.html" class="btn btn-secondary btn-sm"><i class="fas fa-home"></i> Dashboard</a>
</div>

<div class="wrap">
  <div id="app">
    <div style="text-align:center;padding:80px 20px;color:var(--text-muted);">
      <div style="display:inline-block;width:40px;height:40px;border:4px solid var(--sub-bg);border-top-color:var(--link-color);border-radius:50%;animation:spin .8s linear infinite;"></div>
      <p style="margin-top:14px;">Memuat riwayat...</p>
    </div>
  </div>
</div>

<style>@keyframes spin{100%{transform:rotate(360deg)}}</style>

<script>
// ===== DARK MODE =====
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const icon = document.getElementById('themeIcon');
  if (icon) icon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
}
applyTheme(localStorage.getItem('theme') || 'light');

// ===== KONFIG =====
const API = 'https://script.google.com/macros/s/AKfycbxgov9M_0EcaqEh15k2piFH9XZGiFC_05mgl_PeZ166pqxCzYlWl7AaW9xLnWFilFwE/exec';

// ===== STATE =====
let user = JSON.parse(localStorage.getItem('user') || 'null');
if (!user) location.href = 'login.html';
document.getElementById('userName').textContent = user.nama || user.username;

let historyData = [];

// ===== REFRESH USER =====
function refreshUser() {
  return fetch(API + '?action=getProfile&username=' + encodeURIComponent(user.username) + '&t=' + Date.now())
    .then(r => r.json())
    .then(res => {
      if (res.success && res.user) {
        user = { ...user, ...res.user };
        localStorage.setItem('user', JSON.stringify(user));
        document.getElementById('userName').textContent = user.nama || user.username;
      }
    })
    .catch(() => {});
}

// ===== UPDATE KUOTA (di dalam function, aman) =====
function refreshQuota() {
  return fetch(API + '?action=getQuota&username=' + encodeURIComponent(user.username) + '&t=' + Date.now())
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        user.quotaUsed = res.quotaUsed;
        user.quotaMax = res.quotaMax;
        localStorage.setItem('user', JSON.stringify(user));
      }
    })
    .catch(() => {});
}

// ===== LOAD HISTORY =====
function loadHistory() {
  const app = document.getElementById('app');
  fetch(API + '?action=getHistory&username=' + encodeURIComponent(user.username) + '&t=' + Date.now())
    .then(r => r.json())
    .then(data => { historyData = Array.isArray(data) ? data : []; renderPage(); })
    .catch(() => {
      app.innerHTML = `
        <div class="empty">
          <i class="fas fa-exclamation-triangle"></i>
          <h3>Gagal Memuat Riwayat</h3>
          <p>Periksa koneksi internet Anda</p>
          <button class="btn btn-primary" onclick="loadHistory()"><i class="fas fa-redo"></i> Coba Lagi</button>
        </div>`;
    });
}

// ===== RENDER PAGE =====
function renderPage() {
  const app = document.getElementById('app');
  if (historyData.length === 0) {
    app.innerHTML = `
      <div class="title">Halo, <strong>${user.nama || user.username}</strong> 👋</div>
      <p class="sub">Belum ada riwayat ujian. Ayo mulai latihan!</p>
      <div class="empty">
        <i class="fas fa-clipboard-list"></i>
        <h3>Belum Ada Riwayat</h3>
        <p>Kerjakan ujian dulu untuk melihat riwayat & sertifikat</p>
        <a href="dashboard.html" class="btn btn-primary"><i class="fas fa-play"></i> Mulai Latihan</a>
      </div>`;
    return;
  }

  const total = historyData.length;
  const avg = Math.round(historyData.reduce((s, h) => s + h.skor, 0) / total);
  const best = Math.max.apply(null, historyData.map(h => h.skor));
  const certCount = historyData.filter(h => h.skor >= 70).length;

  let html = `
    <div class="title">Halo, <strong>${user.nama || user.username}</strong> 👋</div>
    <p class="sub">Ini riwayat ujian & sertifikat kamu</p>
    <div class="stats">
      <div class="stat"><div class="n">${total}</div><div class="l">Total Ujian</div></div>
      <div class="stat green"><div class="n">${avg}</div><div class="l">Rata-rata</div></div>
      <div class="stat orange"><div class="n">${best}</div><div class="l">Terbaik</div></div>
      <div class="stat purple"><div class="n">${certCount}</div><div class="l">Lulus (≥70)</div></div>
    </div>
    <div class="card">
      <h2><i class="fas fa-list"></i> Riwayat Ujian (${total})</h2>`;

  historyData.forEach((h, i) => {
    const isLulus = h.skor >= 70;
    const color = h.skor >= 90 ? '#2fa36b' : h.skor >= 80 ? '#2fa36b' : h.skor >= 70 ? '#f0ad4e' : '#d9534f';
    const katLabel = formatKategori(h.kategori);
    const skorL = h.skorListening !== null && h.skorListening !== undefined ? h.skorListening : '-';
    const skorR = h.skorReading !== null && h.skorReading !== undefined ? h.skorReading : '-';

    html += `
      <div class="hist-item">
        <div class="hist-score" style="background:${color}"><div class="n">${h.skor}</div><div class="l">SKOR</div></div>
        <div class="hist-info">
          <h3>${katLabel}</h3>
          <div class="meta">
            <span><i class="fas fa-calendar"></i> ${h.tanggal}</span>
            <span><i class="fas fa-check" style="color:#2fa36b;"></i> ${h.benar}</span>
            <span><i class="fas fa-times" style="color:#d9534f;"></i> ${h.salah}</span>
            <span><i class="fas fa-minus" style="color:#888;"></i> ${h.kosong}</span>
            ${h.totalListening > 0 ? `<span><i class="fas fa-headphones" style="color:#7c4dff;"></i> L:${skorL}</span>` : ''}
            ${h.totalReading > 0 ? `<span><i class="fas fa-book-reader" style="color:#26a69a;"></i> R:${skorR}</span>` : ''}
            <span style="font-weight:700;color:${isLulus ? '#2fa36b' : '#d9534f'};">
              ${isLulus ? '✓ LULUS' : '✗ BELUM LULUS'}
            </span>
          </div>
        </div>
        <div class="hist-actions">
          <button class="btn ${isLulus ? 'btn-warning' : 'btn-primary'} btn-sm" onclick="showCertificate(${i})">
            <i class="fas fa-award"></i> Cetak Sertifikat
          </button>
        </div>
      </div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
}

// ===== FORMAT KATEGORI =====
function formatKategori(k) {
  const map = { 'eps':'Soal EPS-TOPIK','kosakata':'Kosakata','tata_bahasa':'Tata Bahasa','listening':'Listening','reading':'Reading','umum':'Umum' };
  return map[k] || k || 'Umum';
}

// ===== SHOW CERTIFICATE =====
function showCertificate(index) {
  const h = historyData[index];
  if (!h) return;
  const app = document.getElementById('app');
  const katLabel = formatKategori(h.kategori);
  const certId = 'EPST-' + String(h.id).padStart(4, '0');
  const isLulus = h.skor >= 70;

  let grade, predikat;
  if (h.skor >= 90) { grade = 'Sangat Baik'; predikat = 'A'; }
  else if (h.skor >= 80) { grade = 'Baik'; predikat = 'B'; }
  else if (h.skor >= 70) { grade = 'Cukup'; predikat = 'C'; }
  else if (h.skor >= 60) { grade = 'Kurang'; predikat = 'D'; }
  else { grade = 'Perlu Latihan'; predikat = 'E'; }

  const today = new Date().toLocaleDateString('id-ID', { day:'2-digit', month:'long', year:'numeric' });

  const highlightClass = isLulus
    ? (h.skor >= 90 ? 'highlight' : 'highlight warn')
    : 'highlight fail';

  const ketText = isLulus
    ? `Berdasarkan hasil ujian <strong>${katLabel}</strong> yang dilaksanakan pada <strong>${h.tanggal}</strong>, peserta dinyatakan <strong>LULUS</strong> dengan predikat <strong>${grade} (${predikat})</strong> dan skor akhir <strong>${h.skor}</strong> dari total <strong>${h.total}</strong> soal.`
    : `Berdasarkan hasil ujian <strong>${katLabel}</strong> yang dilaksanakan pada <strong>${h.tanggal}</strong>, peserta dinyatakan <strong>BELUM LULUS</strong> dengan predikat <strong>${grade} (${predikat})</strong> dan skor akhir <strong>${h.skor}</strong> dari total <strong>${h.total}</strong> soal. Peserta disarankan untuk mengulang latihan.`;

  const fotoHtml = user.foto
    ? `<img src="${user.foto}" onerror="this.parentNode.innerHTML='<i class=\\'fas fa-user\\'></i><span>FOTO</span>'">`
    : `<i class="fas fa-user"></i><span>FOTO</span>`;

  const hasL = h.totalListening > 0;
  const hasR = h.totalReading > 0;
  const skorL = hasL ? h.skorListening : null;
  const skorR = hasR ? h.skorReading : null;

  let nilaiHtml = '';
  if (hasL || hasR) {
    const cols = (hasL && hasR) ? 'g3' : 'g2';
    nilaiHtml = `<div class="cert-nilai-grid ${cols}">`;
    if (hasL) {
      nilaiHtml += `
        <div class="cert-nilai listening">
          <div class="n">${skorL !== null ? skorL : '-'}</div>
          <div class="l">🎧 Nilai Listening</div>
        </div>`;
    }
    if (hasR) {
      nilaiHtml += `
        <div class="cert-nilai reading">
          <div class="n">${skorR !== null ? skorR : '-'}</div>
          <div class="l">📖 Nilai Reading</div>
        </div>`;
    }
    nilaiHtml += `
      <div class="cert-nilai ${highlightClass}">
        <div class="n">${h.skor}</div>
        <div class="l">Skor Akhir</div>
      </div>
    </div>`;
  } else {
    nilaiHtml = `
      <div class="cert-nilai-grid g2">
        <div class="cert-nilai">
          <div class="n">${h.benar}</div>
          <div class="l">Benar</div>
        </div>
        <div class="cert-nilai ${highlightClass}">
          <div class="n">${h.skor}</div>
          <div class="l">Skor Akhir</div>
        </div>
      </div>`;
  }

  let detailHtml = '';
  if (hasL || hasR) {
    detailHtml = `<div class="cert-nilai-grid g4" style="margin-top:-12px;">`;
    if (hasL) {
      detailHtml += `
        <div class="cert-nilai">
          <div class="n" style="font-size:16px;">${h.benarListening}/${h.totalListening}</div>
          <div class="l">🎧 L Benar</div>
        </div>`;
    } else {
      detailHtml += `<div class="cert-nilai" style="opacity:.4;"><div class="n" style="font-size:16px;">-</div><div class="l">🎧 L Benar</div></div>`;
    }
    if (hasR) {
      detailHtml += `
        <div class="cert-nilai">
          <div class="n" style="font-size:16px;">${h.benarReading}/${h.totalReading}</div>
          <div class="l">📖 R Benar</div>
        </div>`;
    } else {
      detailHtml += `<div class="cert-nilai" style="opacity:.4;"><div class="n" style="font-size:16px;">-</div><div class="l">📖 R Benar</div></div>`;
    }
    detailHtml += `
        <div class="cert-nilai"><div class="n" style="font-size:16px;">${h.benar}</div><div class="l">Total Benar</div></div>
        <div class="cert-nilai"><div class="n" style="font-size:16px;">${h.total}</div><div class="l">Total Soal</div></div>
      </div>`;
  }

  app.innerHTML = `
    <div style="margin-bottom:20px;text-align:center;" class="no-print">
      <button class="btn btn-secondary" onclick="renderPage()"><i class="fas fa-arrow-left"></i> Kembali ke Riwayat</button>
    </div>

    <div id="certificate">
      <div class="cert-frame">
        <div class="cert-kop">
          <div class="logo">🇰🇷</div>
          <div class="kop-text">
            <h1>CERTIFICATE OF ACHIEVEMENT</h1>
            <h2>Sertifikat Hasil Ujian — EPS-TOPIK Practice</h2>
            <p>PROGRAM LATIHAN BAHASA KOREA</p>
          </div>
        </div>
        <div class="cert-strip"></div>

        <div class="cert-body">
          <div class="cert-watermark">EPS</div>

          <div class="cert-title-block">
            <div class="en">Certificate of Test Result</div>
            <div class="id">SERTIFIKAT HASIL UJIAN</div>
            <div class="kategori">${katLabel.toUpperCase()}</div>
            <div>
              <span class="cert-status ${isLulus ? 'lulus' : 'belum'}">
                <i class="fas ${isLulus ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                ${isLulus ? 'LULUS' : 'BELUM LULUS'}
              </span>
            </div>
          </div>

          <div class="cert-grid">
            <div class="cert-field">
              <div class="lbl">Nomor Sertifikat</div>
              <div class="val">${certId}</div>
            </div>
            <div class="cert-field">
              <div class="lbl">Tanggal Ujian</div>
              <div class="val">${h.tanggal}</div>
            </div>
            <div class="cert-field full">
              <div class="lbl">Nama Peserta</div>
              <div class="val">${(h.nama || h.username).toUpperCase()}</div>
            </div>
            <div class="cert-field">
              <div class="lbl">Username</div>
              <div class="val">${h.username}</div>
            </div>
            <div class="cert-field">
              <div class="lbl">Kategori Ujian</div>
              <div class="val">${katLabel}</div>
            </div>
          </div>

          <div class="cert-photo">${fotoHtml}</div>

          <div class="cert-nilai-title">Hasil Penilaian</div>
          ${nilaiHtml}
          ${detailHtml}

          <div class="cert-ket ${isLulus ? '' : 'fail'}">${ketText}</div>

          <div class="cert-footer">
            <div class="info-block">
              <strong>Diterbitkan pada:</strong><br>
              ${today}<br><br>
              <span style="font-size:10px;">ID: ${certId}</span>
            </div>
            <div class="cert-seal"><i class="fas fa-award"></i>VERIFIED</div>
            <div class="ttd-block">
              <div class="ttd-line"></div>
              <div class="ttd-name">EPS-TOPIK Practice</div>
              <div class="ttd-role">Penyelenggara Ujian</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="cert-actions no-print">
      <button class="btn btn-primary" onclick="downloadCert('${certId}')"><i class="fas fa-download"></i> Download Sertifikat</button>
      <button class="btn btn-secondary" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
    </div>

    <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:20px;" class="no-print">
      ID Sertifikat: <strong>${certId}</strong>
    </p>`;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// ===== DOWNLOAD =====
function downloadCert(certId) {
  const target = document.getElementById('certificate');
  if (!target) return;
  if (typeof html2canvas === 'undefined') {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = () => doDownload(target, certId);
    s.onerror = () => alert('Gagal load library. Coba refresh halaman.');
    document.head.appendChild(s);
  } else {
    doDownload(target, certId);
  }
}

function doDownload(target, certId) {
  const btns = document.querySelectorAll('.cert-actions button');
  btns.forEach(b => b.disabled = true);
  html2canvas(target, { scale: 2, backgroundColor: '#ffffff', useCORS: true })
    .then(canvas => {
      const link = document.createElement('a');
      link.download = `Sertifikat_${certId}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      btns.forEach(b => b.disabled = false);
    })
    .catch(err => {
      alert('Gagal download: ' + err.message);
      btns.forEach(b => b.disabled = false);
    });
}

// ===== INIT =====
// Urutan yang bener: deklarasi → fetch → render
refreshQuota();
refreshUser().then(() => loadHistory());
</script>
