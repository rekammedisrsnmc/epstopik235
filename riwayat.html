<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat & Sertifikat — EPS-TOPIK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#fafafa;
  --card-bg:#ffffff;
  --text:#1a1a1a;
  --muted:#8a8a8a;
  --border:#e5e5e5;
  --accent:#2563eb;
  --accent-hover:#1d4ed8;
  --sub-bg:#f5f5f5;
  --dropdown-shadow:0 8px 24px rgba(0,0,0,.08);
  --red:#dc2626;
  --green:#16a34a;
  --yellow:#d97706;
  --purple:#7c3aed;
  --gold:#b45309;
}
[data-theme="dark"]{
  --bg:#0f0f0f;
  --card-bg:#1a1a1a;
  --text:#ededed;
  --muted:#888;
  --border:#2a2a2a;
  --accent:#5b9cff;
  --accent-hover:#7ab0ff;
  --sub-bg:#141414;
  --dropdown-shadow:0 8px 24px rgba(0,0,0,.5);
  --red:#f87171;
  --green:#4ade80;
  --yellow:#fbbf24;
  --purple:#a78bfa;
  --gold:#fbbf24;
}
*{margin:0;padding:0;box-sizing:border-box;
  font-family:-apple-system,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;}
body{
  background:var(--bg);
  min-height:100vh;
  color:var(--text);
  font-size:15px;
  line-height:1.6;
  transition:background .2s,color .2s;
}

/* ===== TOPBAR (persis kaya dashboard) ===== */
.topbar{
  background:var(--card-bg);
  padding:14px 24px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:50;
  flex-wrap:wrap;
}
.topbar h1{
  font-size:16px;
  color:var(--text);
  font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.topbar h1 i{color:var(--muted);font-size:14px;}
.topbar .spacer{flex:1;}

/* User — POLOS (no pill) */
.topbar .user{
  font-size:13px;color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
.topbar .user strong{color:var(--text);font-weight:500;}

.topbar .user .user-meta{
  display:flex;flex-direction:column;line-height:1.2;
}
.topbar .user .user-meta .name-row{
  display:flex;align-items:center;gap:6px;
}
.topbar .user .user-meta .email{
  font-size:11px;color:var(--muted);
}

.topbar .user .avatar-mini{
  width:28px;height:28px;border-radius:50%;object-fit:cover;
  border:1px solid var(--border);
}
.topbar .user .avatar-init{
  width:28px;height:28px;border-radius:50%;
  background:var(--sub-bg);color:var(--text);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;
}

/* Badge — outline, no background */
.topbar .user .badge{
  font-size:10px;
  padding:2px 8px;
  border-radius:10px;
  font-weight:600;
  border:1px solid transparent;
  background:transparent;
}
.topbar .user .badge.admin{color:var(--red);border-color:var(--red);}
.topbar .user .badge.user{color:var(--muted);border-color:var(--border);}
.topbar .user .badge.premium{color:var(--gold);border-color:var(--gold);font-weight:700;}

/* Icon bell & moon — BULAT */
.topbar .btn-icon{
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  width:36px;height:36px;
  border-radius:50%;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
  transition:.15s;
  position:relative;
  text-decoration:none;
}
.topbar .btn-icon:hover{color:var(--text);border-color:var(--text);}

/* Tombol Dashboard — subtle */
.topbar .btn-dashboard{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  padding:7px 12px;
  border-radius:8px;
  font-weight:500;
  font-size:12px;
  text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
  transition:.15s;
}
.topbar .btn-dashboard:hover{background:var(--sub-bg);border-color:var(--muted);}

/* Tombol Keluar — link teks */
.topbar .logout{
  color:var(--red);
  text-decoration:none;
  font-weight:500;
  font-size:13px;
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 12px;border-radius:8px;
  transition:.15s;
}
.topbar .logout:hover{background:var(--sub-bg);}

/* ===== NOTIF DROPDOWN ===== */
.notif-wrapper{position:relative;}
.notif-dropdown{
  display:none;position:absolute;top:calc(100% + 12px);right:0;
  width:360px;max-width:calc(100vw - 40px);
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:var(--dropdown-shadow);
  z-index:100;overflow:hidden;
}
.notif-wrapper.open .notif-dropdown{display:block;}
.notif-head{
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.notif-head h3{font-size:13px;font-weight:600;color:var(--text);}
.notif-head .btn-mark{
  background:transparent;border:none;color:var(--accent);
  font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;
  padding:4px 8px;border-radius:6px;transition:.15s;
}
.notif-head .btn-mark:hover{background:var(--sub-bg);}
.notif-body{max-height:400px;overflow-y:auto;}
.notif-item-drop{
  display:flex;gap:12px;padding:12px 18px;
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:.15s;text-decoration:none;color:inherit;
  position:relative;
}
.notif-item-drop:last-child{border-bottom:none;}
.notif-item-drop:hover{background:var(--sub-bg);}
.notif-item-drop.unread{background:var(--sub-bg);}
.notif-item-drop .ic{
  width:34px;height:34px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:14px;
  background:var(--sub-bg);border:1px solid var(--border);
}
.notif-item-drop.tipe-bantuan .ic{color:var(--yellow);}
.notif-item-drop.tipe-balasan .ic{color:var(--green);}
.notif-item-drop.tipe-kuota .ic{color:var(--purple);}
.notif-item-drop.tipe-sistem .ic{color:var(--accent);}
.notif-item-drop.tipe-request .ic{color:var(--red);}
.notif-item-drop.tipe-chat .ic{color:var(--accent);}
.notif-item-drop .tx{flex:1;min-width:0;}
.notif-item-drop .tx .ttl{
  font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;line-height:1.3;
}
.notif-item-drop .tx .msg{
  font-size:12px;color:var(--muted);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.notif-item-drop .tx .tm{font-size:10px;color:var(--muted);margin-top:4px;}
.notif-empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;}
.notif-empty i{font-size:32px;opacity:.3;display:block;margin-bottom:10px;}
.notif-foot{padding:12px 18px;border-top:1px solid var(--border);text-align:center;}
.notif-foot a{
  color:var(--accent);font-weight:500;font-size:13px;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.notif-foot a:hover{gap:9px;}

/* ===== BUTTONS ===== */
.btn{
  padding:9px 16px;
  border:none;
  border-radius:8px;
  font-weight:500;
  font-size:13px;
  cursor:pointer;
  transition:.15s;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:inherit;
  text-decoration:none;
}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);}
.btn-secondary{
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover:not(:disabled){background:var(--sub-bg);border-color:var(--muted);}
.btn-warning{background:var(--yellow);color:#fff;}
.btn-warning:hover:not(:disabled){filter:brightness(1.1);}
.btn-sm{padding:7px 12px;font-size:12px;}

/* ===== LAYOUT ===== */
.wrap{
  max-width:1000px;
  margin:32px auto;
  padding:0 20px;
}
.title{
  font-size:20px;
  color:var(--text);
  margin-bottom:4px;
  font-weight:600;
  letter-spacing:-0.2px;
}
.title strong{color:var(--accent);font-weight:600;}
.sub{color:var(--muted);font-size:13px;margin-bottom:24px;}

/* ===== STATS ===== */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:24px;
}
.stat{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:18px;
  text-align:center;
}
.stat .n{
  font-size:24px;
  font-weight:700;
  color:var(--accent);
  letter-spacing:-0.5px;
}
.stat .l{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
  text-transform:uppercase;
  letter-spacing:.5px;
}
.stat.green .n{color:var(--green);}
.stat.orange .n{color:var(--yellow);}
.stat.purple .n{color:var(--purple);}

/* ===== CARD ===== */
.card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:22px;
  margin-bottom:20px;
}
.card h2{
  font-size:15px;
  color:var(--text);
  margin-bottom:18px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
  padding-bottom:12px;
  border-bottom:1px solid var(--border);
}
.card h2 i{color:var(--muted);font-size:14px;}

/* ===== HISTORY ITEM ===== */
.hist-item{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:8px;
  transition:.15s;
  background:var(--card-bg);
}
.hist-item:hover{border-color:var(--muted);}
.hist-item:last-child{margin-bottom:0;}

.hist-score{
  width:56px;height:56px;
  border-radius:50%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  flex-shrink:0;
  background:var(--sub-bg);
}
.hist-score .n{font-size:18px;line-height:1;font-weight:700;}
.hist-score .l{font-size:8px;letter-spacing:.8px;opacity:.9;margin-top:2px;font-weight:500;}

.hist-info{flex:1;min-width:0;}
.hist-info h3{
  font-size:14px;
  color:var(--text);
  margin-bottom:4px;
  font-weight:600;
}
.hist-info .meta{
  font-size:12px;
  color:var(--muted);
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}
.hist-info .meta span{
  display:flex;
  align-items:center;
  gap:4px;
}
.hist-actions{display:flex;gap:8px;flex-shrink:0;}

/* ===== EMPTY ===== */
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}
.empty i{
  font-size:44px;
  opacity:.4;
  display:block;
  margin-bottom:14px;
}
.empty h3{
  color:var(--text);
  margin-bottom:6px;
  font-size:15px;
  font-weight:600;
}
.empty p{font-size:13px;margin-bottom:20px;}

/* =================================================== */
/*  SERTIFIKAT — A4 LANDSCAPE                          */
/* =================================================== */
.cert-frame{
  background:#fff;
  border-radius:6px;
  padding:0;
  position:relative;
  box-shadow:0 12px 40px rgba(0,0,0,.15);
  max-width:1000px;
  margin:0 auto;
  overflow:hidden;
  border:1px solid #d0d7e2;
  color:#333;
}
.cert-kop{
  display:flex;align-items:center;gap:16px;
  padding:18px 40px;
  background:linear-gradient(135deg,#154a82,#1e5fa8);
  color:#fff;
}
.cert-kop .logo{
  width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
  border:2px solid rgba(255,255,255,.3);
}
.cert-kop .kop-text{flex:1;}
.cert-kop .kop-text h1{font-size:14px;letter-spacing:2px;font-weight:800;line-height:1.2;}
.cert-kop .kop-text h2{font-size:12px;font-weight:600;opacity:.9;line-height:1.2;margin-top:2px;}
.cert-kop .kop-text p{font-size:9px;opacity:.75;margin-top:3px;letter-spacing:1px;}
.cert-strip{height:5px;background:linear-gradient(90deg,#f0ad4e,#f5d589,#f0ad4e,#f5d589);}

.cert-body{padding:26px 56px 32px;position:relative;}

.cert-title-block{text-align:center;margin-bottom:20px;}
.cert-title-block .en{font-size:11px;letter-spacing:4px;color:#888;text-transform:uppercase;font-weight:600;}
.cert-title-block .id{font-size:24px;letter-spacing:3px;color:#154a82;font-weight:800;margin-top:3px;}
.cert-title-block .kategori{
  display:inline-block;margin-top:7px;
  background:#e8f0fa;color:#1e5fa8;
  padding:3px 14px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:1px;
}
.cert-status{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:9px;padding:4px 16px;border-radius:20px;
  font-size:11px;font-weight:800;letter-spacing:1.5px;
}
.cert-status.lulus{background:#e8f5ee;color:#1f7f53;border:2px solid #2fa36b;}
.cert-status.belum{background:#fde8e8;color:#a33;border:2px solid #d9534f;}

.cert-main{
  display:grid;
  grid-template-columns:1fr 130px;
  gap:24px;
  margin-bottom:20px;
  align-items:flex-start;
}
.cert-main-right{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.cert-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px 26px;
}
.cert-field .lbl{
  font-size:9px;letter-spacing:1px;color:#888;
  text-transform:uppercase;font-weight:600;margin-bottom:3px;
}
.cert-field .val{
  font-size:13px;color:#222;font-weight:700;
  padding-bottom:3px;border-bottom:1px solid #e4e8ee;
}
.cert-field.full{grid-column:span 2;}
.cert-photo{
  width:110px;height:140px;
  border:2px solid #d0d7e2;border-radius:4px;
  background:linear-gradient(135deg,#f5f7fa,#e8f0fa);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#aaa;font-size:10px;text-align:center;gap:4px;
  overflow:hidden;flex-shrink:0;
}
.cert-photo img{width:100%;height:100%;object-fit:cover;}
.cert-photo i{font-size:28px;color:#c0c8d4;}

.cert-nilai-title{
  text-align:center;font-size:10px;letter-spacing:3px;
  color:#888;text-transform:uppercase;font-weight:700;
  margin:18px 0 10px;position:relative;
}
.cert-nilai-title::before,.cert-nilai-title::after{
  content:'';position:absolute;top:50%;width:30%;height:1px;background:#e4e8ee;
}
.cert-nilai-title::before{left:0;}
.cert-nilai-title::after{right:0;}
.cert-nilai-grid{display:grid;gap:10px;margin-bottom:18px;}
.cert-nilai-grid.g3{grid-template-columns:repeat(3,1fr);}
.cert-nilai-grid.g4{grid-template-columns:repeat(4,1fr);}
.cert-nilai-grid.g2{grid-template-columns:repeat(2,1fr);}
.cert-nilai{
  text-align:center;padding:12px 8px;
  background:#f5f7fa;border-radius:8px;border:1px solid #e4e8ee;
}
.cert-nilai .n{font-size:20px;font-weight:800;color:#1e5fa8;line-height:1;}
.cert-nilai .l{font-size:9px;color:#888;margin-top:5px;letter-spacing:1px;text-transform:uppercase;}
.cert-nilai.highlight{background:linear-gradient(135deg,#2fa36b,#1f7f53);border:none;}
.cert-nilai.highlight .n,.cert-nilai.highlight .l{color:#fff;}
.cert-nilai.highlight.warn{background:linear-gradient(135deg,#f0ad4e,#ec971f);}
.cert-nilai.highlight.fail{background:linear-gradient(135deg,#d9534f,#c9302c);}
.cert-nilai.listening{background:linear-gradient(135deg,#7c4dff,#5e35b1);border:none;}
.cert-nilai.listening .n,.cert-nilai.listening .l{color:#fff;}
.cert-nilai.reading{background:linear-gradient(135deg,#26a69a,#00796b);border:none;}
.cert-nilai.reading .n,.cert-nilai.reading .l{color:#fff;}

.cert-ket{
  background:linear-gradient(135deg,#fffbf0,#fff8e1);
  border-left:4px solid #f0ad4e;
  padding:12px 16px;border-radius:6px;
  font-size:12px;color:#5a4a1a;line-height:1.6;margin-bottom:20px;
}
.cert-ket.fail{
  background:linear-gradient(135deg,#fde8e8,#fbdada);
  border-left-color:#d9534f;color:#7a2020;
}
.cert-ket strong{color:#8a6a1a;}
.cert-ket.fail strong{color:#a33;}

.cert-footer{
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  padding-top:16px;border-top:1px dashed #d0d7e2;
  font-size:11px;color:#555;
}
.cert-footer .ttd-block{text-align:center;flex-shrink:0;}
.cert-footer .ttd-line{
  width:170px;height:44px;border-bottom:2px solid #333;
  margin-bottom:5px;position:relative;
}
.cert-footer .ttd-line::after{
  content:'✍';position:absolute;bottom:5px;left:50%;
  transform:translateX(-50%);font-size:20px;color:#1e5fa8;opacity:.6;
}
.cert-footer .ttd-name{font-weight:700;color:#222;font-size:12px;}
.cert-footer .ttd-role{font-size:10px;color:#888;margin-top:2px;}
.cert-footer .info-block{
  text-align:left;font-size:10px;color:#888;
  line-height:1.7;flex-shrink:0;
}
.cert-footer .info-block strong{color:#333;font-size:12px;}
.cert-seal{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:74px;height:74px;border-radius:50%;
  border:3px solid #1e5fa8;color:#1e5fa8;
  font-size:8px;font-weight:800;letter-spacing:.5px;
  background:#fff;flex-shrink:0;transform:rotate(-12deg);
  box-shadow:0 4px 12px rgba(30,95,168,.15);margin-bottom:6px;
}
.cert-seal i{font-size:20px;margin-bottom:2px;color:#f0ad4e;}
.cert-watermark{
  position:absolute;inset:0;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  font-size:180px;color:#1e5fa8;opacity:.03;
  font-weight:900;letter-spacing:8px;
}
.cert-actions{
  display:flex;gap:10px;justify-content:center;
  margin-top:24px;flex-wrap:wrap;
}

/* ===== RESPONSIVE ===== */
@media(max-width:700px){
  .topbar{padding:12px 16px;}
  .topbar .user .user-meta{display:none;}
  .notif-dropdown{position:fixed;top:70px;right:12px;left:12px;width:auto;}
  .wrap{margin:20px auto;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .hist-item{flex-wrap:wrap;}
  .hist-actions{width:100%;}
  .hist-actions .btn{flex:1;justify-content:center;}
  .cert-body{padding:20px;}
  .cert-kop{padding:14px 20px;}
  .cert-main{grid-template-columns:1fr;}
  .cert-grid{grid-template-columns:1fr;}
  .cert-field.full{grid-column:span 1;}
  .cert-nilai-grid.g3,.cert-nilai-grid.g4{grid-template-columns:repeat(2,1fr);}
  .cert-footer{flex-direction:column;gap:20px;align-items:center;}
  .cert-footer .info-block{text-align:center;}
  .cert-title-block .id{font-size:20px;letter-spacing:1px;}
}

/* Loading spinner */
@keyframes spin{100%{transform:rotate(360deg)}}
.loading-spin{
  display:inline-block;width:32px;height:32px;
  border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;
}
</style>
</head>
<body>

<div class="topbar">
  <h1><i class="fas fa-history"></i> Riwayat & Sertifikat</h1>
  <div class="spacer"></div>
  <span class="user" id="topbarUser">
    <span id="avatarBox"></span>
    <div class="user-meta">
      <div class="name-row">
        <strong id="userName">-</strong>
        <span class="badge" id="userRole">-</span>
      </div>
      <span class="email" id="userEmail">-</span>
    </div>
  </span>
  <div class="notif-wrapper" id="notifWrapper">
    <button class="btn-icon" onclick="toggleNotifDropdown(event)" title="Notifikasi">
      <i class="fas fa-bell"></i>
    </button>
    <div class="notif-dropdown">
      <div class="notif-head">
        <h3>Notifikasi</h3>
        <button class="btn-mark" onclick="markAllNotifRead(event)">Tandai semua dibaca</button>
      </div>
      <div class="notif-body" id="notifBody">
        <div class="notif-empty"><i class="fas fa-bell-slash"></i> Memuat...</div>
      </div>
      <div class="notif-foot">
        <a href="notifikasi.html">Lihat Semua Notifikasi <i class="fas fa-arrow-right"></i></a>
      </div>
    </div>
  </div>
  <button class="btn-icon" onclick="toggleTheme()" title="Ganti tema">
    <i class="fas fa-moon" id="themeIcon"></i>
  </button>
  <a href="dashboard.html" class="btn-dashboard">
    <i class="fas fa-home"></i> Dashboard
  </a>
  <a href="#" class="logout" onclick="logout(event)">
    <i class="fas fa-sign-out-alt"></i> Keluar
  </a>
</div>

<div class="wrap">
  <div id="app">
    <div style="text-align:center;padding:80px 20px;color:var(--muted);">
      <div class="loading-spin"></div>
      <p style="margin-top:14px;font-size:13px;">Memuat riwayat...</p>
    </div>
  </div>
</div>

<!-- Library PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// ============================================================
//  SESSION & THEME
// ============================================================
const SESSION_MAX_AGE = 8 * 60 * 60 * 1000; // 8 jam

function touchSession() {
  const u = JSON.parse(localStorage.getItem('user') || 'null');
  if (u && u.loginAt) {
    u.loginAt = Date.now();
    localStorage.setItem('user', JSON.stringify(u));
  }
}

function checkSession() {
  const u = JSON.parse(localStorage.getItem('user') || 'null');
  if (!u) { location.href = 'login.html'; return false; }
  if (Date.now() - (u.loginAt || 0) > SESSION_MAX_AGE) {
    localStorage.removeItem('user');
    alert('Sesi kamu habis (8 jam). Silakan login ulang.');
    location.href = 'login.html';
    return false;
  }
  return true;
}

['click','keydown','mousemove','scroll','touchstart'].forEach(evt => {
  document.addEventListener(evt, touchSession, { passive: true });
});
setInterval(touchSession, 60000);

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const icon = document.getElementById('themeIcon');
  if (icon) icon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
}
applyTheme(localStorage.getItem('theme') || 'light');

const API = 'https://script.google.com/macros/s/AKfycbxfHFBDHJuOl-TfzFS65x9aB64vyTX7YnIXu_izwvEZ3e1cNVTXFx3MutlfCGEl6D3R/exec';

if (!checkSession()) throw new Error('Session expired');

let user = JSON.parse(localStorage.getItem('user') || 'null');
if (!user) location.href = 'login.html';

// ===== Render topbar =====
document.getElementById('userName').textContent = user.nama || user.username;
const emailEl = document.getElementById('userEmail');
if (emailEl) emailEl.textContent = user.email || '';

const roleBadge = document.getElementById('userRole');
if (user.role === 'admin') {
  roleBadge.textContent = 'ADMIN';
  roleBadge.className = 'badge admin';
} else {
  const isPrem = (String(user.plan || '').toLowerCase() === 'premium') &&
                 user.premiumUntil && new Date(user.premiumUntil).getTime() > Date.now();
  if (isPrem) {
    roleBadge.innerHTML = '<i class="fas fa-crown"></i> PREMIUM';
    roleBadge.className = 'badge premium';
  } else {
    roleBadge.textContent = 'PELAJAR';
    roleBadge.className = 'badge user';
  }
}

function renderAvatar() {
  const avBox = document.getElementById('avatarBox');
  if (!avBox) return;
  if (user.foto) {
    avBox.innerHTML = `<img src="${user.foto}" class="avatar-mini" onerror="this.outerHTML='<div class=&quot;avatar-init&quot;>${(user.nama||user.username).charAt(0).toUpperCase()}</div>'">`;
  } else {
    const init = (user.nama || user.username).charAt(0).toUpperCase();
    avBox.innerHTML = `<div class="avatar-init">${init}</div>`;
  }
}
renderAvatar();

// ============================================================
//  NOTIF DROPDOWN (auto-refresh kalau kebuka)
// ============================================================
let notifPollTimer = null;

function toggleNotifDropdown(e) {
  e.preventDefault();
  e.stopPropagation();
  const wrapper = document.getElementById('notifWrapper');
  const isOpen = wrapper.classList.contains('open');
  document.querySelectorAll('.notif-wrapper.open').forEach(w => w.classList.remove('open'));
  if (!isOpen) {
    wrapper.classList.add('open');
    loadNotifDropdown();
    startNotifPoll();
  } else {
    stopNotifPoll();
  }
}

function startNotifPoll() {
  stopNotifPoll();
  notifPollTimer = setInterval(() => {
    const wrapper = document.getElementById('notifWrapper');
    if (wrapper && wrapper.classList.contains('open')) {
      loadNotifDropdown(true);
    } else {
      stopNotifPoll();
    }
  }, 15000);
}

function stopNotifPoll() {
  if (notifPollTimer) {
    clearInterval(notifPollTimer);
    notifPollTimer = null;
  }
}

document.addEventListener('click', function(e) {
  const wrapper = document.getElementById('notifWrapper');
  if (wrapper && !wrapper.contains(e.target)) {
    wrapper.classList.remove('open');
    stopNotifPoll();
  }
});

function loadNotifDropdown(silent) {
  const body = document.getElementById('notifBody');
  if (!body) return;
  if (!silent) body.innerHTML = `<div class="notif-empty"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>`;

  fetch(API + '?action=getNotifications&username=' + encodeURIComponent(user.username) + '&t=' + Date.now())
    .then(r => r.json())
    .then(res => {
      if (!res.success || !res.notifications) {
        if (!silent) body.innerHTML = `<div class="notif-empty"><i class="fas fa-bell-slash"></i> Gagal memuat</div>`;
        return;
      }
      const list = res.notifications.slice(0, 10);
      if (list.length === 0) {
        body.innerHTML = `<div class="notif-empty"><i class="fas fa-bell-slash"></i> Belum ada notifikasi</div>`;
        return;
      }
      const iconMap = {
        'bantuan': 'fa-question-circle', 'balasan': 'fa-comment-dots',
        'kuota': 'fa-ticket-alt', 'sistem': 'fa-info-circle',
        'request': 'fa-paper-plane', 'chat': 'fa-comments', 'info': 'fa-bell'
      };
      let html = '';
      list.forEach(n => {
        const ic = iconMap[n.tipe] || 'fa-bell';
        const url = n.linkUrl || 'notifikasi.html';
        html += `
          <div class="notif-item-drop tipe-${n.tipe} ${!n.isRead ? 'unread' : ''}" onclick="handleNotifClick(event, ${n.id}, '${url.replace(/'/g, "\\'")}')">
            <div class="ic"><i class="fas ${ic}"></i></div>
            <div class="tx">
              <div class="ttl">${n.judul || 'Notifikasi'}</div>
              <div class="msg">${n.pesan || ''}</div>
              <div class="tm">${n.tanggal}</div>
            </div>
          </div>`;
      });
      body.innerHTML = html;
    })
    .catch(() => {
      if (!silent) body.innerHTML = `<div class="notif-empty"><i class="fas fa-exclamation-triangle"></i> Gagal memuat</div>`;
    });
}

function handleNotifClick(e, notifId, url) {
  e.stopPropagation();
  fetch(API, {
    method: 'POST', headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action: 'markNotifRead', username: user.username, notifId })
  }).then(() => loadNotifDropdown(true)).catch(() => {});
  const wrapper = document.getElementById('notifWrapper');
  if (wrapper) wrapper.classList.remove('open');
  stopNotifPoll();
  if (url && url !== 'notifikasi.html') {
    setTimeout(() => location.href = url, 200);
  } else {
    location.href = 'notifikasi.html';
  }
}

function markAllNotifRead(e) {
  e.stopPropagation();
  fetch(API, {
    method: 'POST', headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action: 'markAllNotifRead', username: user.username })
  })
  .then(() => { loadNotifDropdown(); })
  .catch(() => {});
}

// ============================================================
//  LOGOUT
// ============================================================
function logout(e) {
  e.preventDefault();
  if (!confirm('Yakin mau keluar?')) return;
  localStorage.removeItem('user');
  location.href = 'login.html';
}

// ============================================================
//  USER DATA & HISTORY
// ============================================================
let historyData = [];

function refreshUser() {
  return fetch(API + '?action=getProfile&username=' + encodeURIComponent(user.username) + '&t=' + Date.now())
    .then(r => r.json())
    .then(res => {
      if (res.success && res.user) {
        user = { ...user, ...res.user, loginAt: user.loginAt };
        localStorage.setItem('user', JSON.stringify(user));
        document.getElementById('userName').textContent = user.nama || user.username;
        const e = document.getElementById('userEmail');
        if (e) e.textContent = user.email || '';
        renderAvatar();
      }
    })
    .catch(() => {});
}

function refreshQuota() {
  return fetch(API + '?action=getQuota&username=' + encodeURIComponent(user.username) + '&t=' + Date.now())
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        user.quotaUsed = res.quotaUsed;
        user.quotaMax = res.quotaMax;
        localStorage.setItem('user', JSON.stringify(user));
      }
    })
    .catch(() => {});
}

function loadHistory() {
  const app = document.getElementById('app');
  fetch(API + '?action=getHistory&username=' + encodeURIComponent(user.username) + '&t=' + Date.now())
    .then(r => r.json())
    .then(data => { historyData = Array.isArray(data) ? data : []; renderPage(); })
    .catch(() => {
      app.innerHTML = `
        <div class="empty">
          <i class="fas fa-exclamation-triangle"></i>
          <h3>Gagal Memuat Riwayat</h3>
          <p>Periksa koneksi internet Anda</p>
          <button class="btn btn-primary" onclick="loadHistory()"><i class="fas fa-redo"></i> Coba Lagi</button>
        </div>`;
    });
}

function renderPage() {
  const app = document.getElementById('app');
  if (historyData.length === 0) {
    app.innerHTML = `
      <div class="title">Halo, <strong>${user.nama || user.username}</strong></div>
      <p class="sub">Belum ada riwayat ujian. Ayo mulai latihan!</p>
      <div class="empty">
        <i class="fas fa-clipboard-list"></i>
        <h3>Belum Ada Riwayat</h3>
        <p>Kerjakan ujian dulu untuk melihat riwayat & sertifikat</p>
        <a href="dashboard.html" class="btn btn-primary"><i class="fas fa-play"></i> Mulai Latihan</a>
      </div>`;
    return;
  }

  const total = historyData.length;
  const avg = Math.round(historyData.reduce((s, h) => s + h.skor, 0) / total);
  const best = Math.max.apply(null, historyData.map(h => h.skor));
  const certCount = historyData.filter(h => h.skor >= 70).length;

  let html = `
    <div class="title">Halo, <strong>${user.nama || user.username}</strong></div>
    <p class="sub">Ini riwayat ujian & sertifikat kamu</p>
    <div class="stats">
      <div class="stat"><div class="n">${total}</div><div class="l">Total Ujian</div></div>
      <div class="stat green"><div class="n">${avg}</div><div class="l">Rata-rata</div></div>
      <div class="stat orange"><div class="n">${best}</div><div class="l">Terbaik</div></div>
      <div class="stat purple"><div class="n">${certCount}</div><div class="l">Lulus (≥70)</div></div>
    </div>
    <div class="card">
      <h2><i class="fas fa-list"></i> Riwayat Ujian (${total})</h2>`;

  historyData.forEach((h, i) => {
    const isLulus = h.skor >= 70;
    const color = h.skor >= 80 ? 'var(--green)' : h.skor >= 70 ? 'var(--yellow)' : 'var(--red)';
    const katLabel = formatKategori(h.kategori);
    const skorL = h.skorListening !== null && h.skorListening !== undefined ? h.skorListening : '-';
    const skorR = h.skorReading !== null && h.skorReading !== undefined ? h.skorReading : '-';

    html += `
      <div class="hist-item">
        <div class="hist-score" style="background:${color}">
          <div class="n">${h.skor}</div>
          <div class="l">SKOR</div>
        </div>
        <div class="hist-info">
          <h3>${katLabel}</h3>
          <div class="meta">
            <span><i class="fas fa-calendar"></i> ${h.tanggal}</span>
            <span><i class="fas fa-check" style="color:var(--green);"></i> ${h.benar}</span>
            <span><i class="fas fa-times" style="color:var(--red);"></i> ${h.salah}</span>
            <span><i class="fas fa-minus" style="color:var(--muted);"></i> ${h.kosong}</span>
            ${h.totalListening > 0 ? `<span><i class="fas fa-headphones" style="color:var(--purple);"></i> L:${skorL}</span>` : ''}
            ${h.totalReading > 0 ? `<span><i class="fas fa-book-reader" style="color:var(--accent);"></i> R:${skorR}</span>` : ''}
            <span style="font-weight:600;color:${isLulus ? 'var(--green)' : 'var(--red)'};">
              ${isLulus ? 'LULUS' : 'BELUM LULUS'}
            </span>
          </div>
        </div>
        <div class="hist-actions">
          <button class="btn ${isLulus ? 'btn-warning' : 'btn-primary'} btn-sm" onclick="showCertificate(${i})">
            <i class="fas fa-award"></i> Lihat Sertifikat
          </button>
        </div>
      </div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
}

function formatKategori(k) {
  if (!k) return 'Umum';
  const key = String(k).toLowerCase();

  if (key.startsWith('kosakata_')) {
    const tema = key.replace('kosakata_', '');
    const temaMap = {
      'transportasi':   'Transportasi',
      'makanan':        'Makanan & Minuman',
      'tempat_wisata':  'Tempat Wisata',
      'keluarga':       'Keluarga',
      'sekolah':        'Sekolah',
      'tubuh':          'Anggota Tubuh',
      'pakaian':        'Pakaian',
      'alam':           'Alam & Cuaca',
      'pekerjaan':      'Pekerjaan',
      'hobi':           'Hobi & Olahraga',
      'umum':           'Kosakata Umum'
    };
    const temaLabel = temaMap[tema] || tema.charAt(0).toUpperCase() + tema.slice(1);
    return 'Kosakata: ' + temaLabel;
  }

  const map = {
    'eps':         'Soal EPS-TOPIK',
    'kosakata':    'Kosakata (Semua Tema)',
    'tata_bahasa': 'Tata Bahasa',
    'listening':   'Listening',
    'reading':     'Reading',
    'umum':        'Umum'
  };
  return map[key] || k;
}

function showCertificate(index) {
  const h = historyData[index];
  if (!h) return;
  const app = document.getElementById('app');
  const katLabel = formatKategori(h.kategori);
  const isLulus = h.skor >= 70;

  const prefixMap = {
    'eps': 'EPS',
    'kosakata': 'KOS',
    'tata_bahasa': 'TBH',
    'listening': 'LIS',
    'reading': 'REA',
    'umum': 'UMN'
  };
  const keyKat = String(h.kategori || 'umum').toLowerCase();
  const prefixKey = keyKat.startsWith('kosakata') ? 'kosakata' : keyKat;
  const prefix = prefixMap[prefixKey] || 'EPS';
  const certId = prefix + '-' + String(h.id).padStart(4, '0');

  let grade, predikat;
  if (h.skor >= 90) { grade = 'Sangat Baik'; predikat = 'A'; }
  else if (h.skor >= 80) { grade = 'Baik'; predikat = 'B'; }
  else if (h.skor >= 70) { grade = 'Cukup'; predikat = 'C'; }
  else if (h.skor >= 60) { grade = 'Kurang'; predikat = 'D'; }
  else { grade = 'Perlu Latihan'; predikat = 'E'; }

  const today = new Date().toLocaleDateString('id-ID', { day:'2-digit', month:'long', year:'numeric' });

  const highlightClass = isLulus
    ? (h.skor >= 90 ? 'highlight' : 'highlight warn')
    : 'highlight fail';

  const ketText = isLulus
    ? `Berdasarkan hasil ujian <strong>${katLabel}</strong> yang dilaksanakan pada <strong>${h.tanggal}</strong>, peserta dinyatakan <strong>LULUS</strong> dengan predikat <strong>${grade} (${predikat})</strong> dan skor akhir <strong>${h.skor}</strong> dari total <strong>${h.total}</strong> soal.`
    : `Berdasarkan hasil ujian <strong>${katLabel}</strong> yang dilaksanakan pada <strong>${h.tanggal}</strong>, peserta dinyatakan <strong>BELUM LULUS</strong> dengan predikat <strong>${grade} (${predikat})</strong> dan skor akhir <strong>${h.skor}</strong> dari total <strong>${h.total}</strong> soal. Peserta disarankan untuk mengulang latihan.`;

  const fotoHtml = user.foto
    ? `<img src="${user.foto}" onerror="this.parentNode.innerHTML='<i class=\\'fas fa-user\\'></i><span>FOTO</span>'">`
    : `<i class="fas fa-user"></i><span>FOTO</span>`;

  const hasL = h.totalListening > 0;
  const hasR = h.totalReading > 0;
  const skorL = hasL ? h.skorListening : null;
  const skorR = hasR ? h.skorReading : null;

  let nilaiHtml = '';
  if (hasL || hasR) {
    const cols = (hasL && hasR) ? 'g3' : 'g2';
    nilaiHtml = `<div class="cert-nilai-grid ${cols}">`;
    if (hasL) {
      nilaiHtml += `
        <div class="cert-nilai listening">
          <div class="n">${skorL !== null ? skorL : '-'}</div>
          <div class="l">Nilai Listening</div>
        </div>`;
    }
    if (hasR) {
      nilaiHtml += `
        <div class="cert-nilai reading">
          <div class="n">${skorR !== null ? skorR : '-'}</div>
          <div class="l">Nilai Reading</div>
        </div>`;
    }
    nilaiHtml += `
      <div class="cert-nilai ${highlightClass}">
        <div class="n">${h.skor}</div>
        <div class="l">Skor Akhir</div>
      </div>
    </div>`;
  } else {
    nilaiHtml = `
      <div class="cert-nilai-grid g2">
        <div class="cert-nilai">
          <div class="n">${h.benar}</div>
          <div class="l">Benar</div>
        </div>
        <div class="cert-nilai ${highlightClass}">
          <div class="n">${h.skor}</div>
          <div class="l">Skor Akhir</div>
        </div>
      </div>`;
  }

  let detailHtml = '';
  if (hasL || hasR) {
    detailHtml = `<div class="cert-nilai-grid g4" style="margin-top:-8px;">`;
    if (hasL) {
      detailHtml += `
        <div class="cert-nilai">
          <div class="n" style="font-size:15px;">${h.benarListening}/${h.totalListening}</div>
          <div class="l">L Benar</div>
        </div>`;
    } else {
      detailHtml += `<div class="cert-nilai" style="opacity:.4;"><div class="n" style="font-size:15px;">-</div><div class="l">L Benar</div></div>`;
    }
    if (hasR) {
      detailHtml += `
        <div class="cert-nilai">
          <div class="n" style="font-size:15px;">${h.benarReading}/${h.totalReading}</div>
          <div class="l">R Benar</div>
        </div>`;
    } else {
      detailHtml += `<div class="cert-nilai" style="opacity:.4;"><div class="n" style="font-size:15px;">-</div><div class="l">R Benar</div></div>`;
    }
    detailHtml += `
        <div class="cert-nilai"><div class="n" style="font-size:15px;">${h.benar}</div><div class="l">Total Benar</div></div>
        <div class="cert-nilai"><div class="n" style="font-size:15px;">${h.total}</div><div class="l">Total Soal</div></div>
      </div>`;
  }

  app.innerHTML = `
    <div style="margin-bottom:20px;text-align:center;">
      <button class="btn btn-secondary" onclick="renderPage()">
        <i class="fas fa-arrow-left"></i> Kembali ke Riwayat
      </button>
    </div>

    <div id="certificate">
      <div class="cert-frame">
        <div class="cert-kop">
          <div class="logo">🇰🇷</div>
          <div class="kop-text">
            <h1>CERTIFICATE OF ACHIEVEMENT</h1>
            <h2>Sertifikat ${katLabel}</h2>
            <p>PROGRAM LATIHAN BAHASA KOREA</p>
          </div>
        </div>
        <div class="cert-strip"></div>

        <div class="cert-body">
          <div class="cert-watermark">EPS</div>

          <div class="cert-title-block">
            <div class="en">Certificate of Test Result</div>
            <div class="id">SERTIFIKAT HASIL UJIAN</div>
            <div class="kategori">${katLabel.toUpperCase()}</div>
            <div>
              <span class="cert-status ${isLulus ? 'lulus' : 'belum'}">
                <i class="fas ${isLulus ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                ${isLulus ? 'LULUS' : 'BELUM LULUS'}
              </span>
            </div>
          </div>

          <div class="cert-main">
            <div class="cert-grid">
              <div class="cert-field">
                <div class="lbl">Nomor Sertifikat</div>
                <div class="val">${certId}</div>
              </div>
              <div class="cert-field">
                <div class="lbl">Tanggal Ujian</div>
                <div class="val">${h.tanggal}</div>
              </div>
              <div class="cert-field full">
                <div class="lbl">Nama Peserta</div>
                <div class="val">${(h.nama || h.username).toUpperCase()}</div>
              </div>
              <div class="cert-field">
                <div class="lbl">Username</div>
                <div class="val">${h.username}</div>
              </div>
              <div class="cert-field">
                <div class="lbl">Kategori Ujian</div>
                <div class="val">${katLabel}</div>
              </div>
            </div>

            <div class="cert-main-right">
              <div class="cert-photo">${fotoHtml}</div>
            </div>
          </div>

          <div class="cert-nilai-title">Hasil Penilaian</div>
          ${nilaiHtml}
          ${detailHtml}

          <div class="cert-ket ${isLulus ? '' : 'fail'}">${ketText}</div>

          <div class="cert-footer">
            <div class="info-block">
              <strong>Diterbitkan pada:</strong><br>
              ${today}<br><br>
              <span style="font-size:9px;">ID: ${certId}</span>
            </div>
            <div class="cert-seal"><i class="fas fa-award"></i>VERIFIED</div>
            <div class="ttd-block">
              <div class="ttd-line"></div>
              <div class="ttd-name">EPS-TOPIK Practice</div>
              <div class="ttd-role">Penyelenggara Ujian</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="cert-actions">
      <button class="btn btn-primary" onclick="downloadCertPDF('${certId}')"><i class="fas fa-file-pdf"></i> Download PDF</button>
      <button class="btn btn-secondary" onclick="renderPage()"><i class="fas fa-arrow-left"></i> Kembali</button>
    </div>

    <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:20px;">
      ID Sertifikat: <strong>${certId}</strong>
    </p>`;
  window.scrollTo({top:0, behavior:'smooth'});
}

async function downloadCertPDF(certId) {
  const target = document.getElementById('certificate');
  if (!target) return;

  const btns = document.querySelectorAll('.cert-actions button');
  const originalTexts = [];
  btns.forEach((b, i) => {
    originalTexts[i] = b.innerHTML;
    b.disabled = true;
  });

  const dlBtn = document.querySelector('.cert-actions .btn-primary');
  if (dlBtn) dlBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses PDF...';

  try {
    const canvas = await html2canvas(target, {
      scale: 2,
      backgroundColor: '#ffffff',
      useCORS: true,
      logging: false
    });

    const imgData = canvas.toDataURL('image/jpeg', 0.95);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: 'landscape',
      unit: 'mm',
      format: 'a4'
    });

    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 6;

    const availW = pageW - margin * 2;
    const availH = pageH - margin * 2;

    const canvasRatio = canvas.width / canvas.height;
    let imgW = availW;
    let imgH = imgW / canvasRatio;

    if (imgH > availH) {
      imgH = availH;
      imgW = imgH * canvasRatio;
    }

    const offsetX = margin + (availW - imgW) / 2;
    const offsetY = margin + (availH - imgH) / 2;

    pdf.addImage(imgData, 'JPEG', offsetX, offsetY, imgW, imgH, undefined, 'FAST');

    pdf.save(`Sertifikat_${certId}.pdf`);

  } catch (err) {
    console.error(err);
    alert('Gagal membuat PDF: ' + err.message);
  } finally {
    btns.forEach((b, i) => {
      b.disabled = false;
      b.innerHTML = originalTexts[i];
    });
  }
}
